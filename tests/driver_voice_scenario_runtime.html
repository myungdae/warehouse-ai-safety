<!doctype html><html><head><meta charset="utf-8"><title>RUNNING - Driver Voice Scenario Runtime</title></head><body><pre id="results"></pre><script src="../backend/static/js/driver_voice_scenario_pack.js"></script><script src="../backend/static/js/driver_voice_scenario_runtime.js"></script><script>(async()=>{'use strict';const pass=[],check=(v,n)=>{if(!v)throw Error(n);pass.push(n)},P=DriverVoiceScenarioPack,R=DriverVoiceScenarioRuntime.DriverVoiceScenarioRuntime;
check(P.version==='DRIVER_VOICE_SCENARIO_PACK_V1','VERSION');check(P.ids.length===17,'SCENARIO_COUNT');check(P.priorityOrder.join('>')==='COLLISION>PEDESTRIAN>INCAPACITATION>ALCOHOL>RIGHT_TURN>DROWSINESS>SYSTEM>CALIBRATION>INFORMATION','PRIORITY_TABLE');P.list().forEach((s,i)=>{check(Boolean(s.id),`ID_${i}`);check(Boolean(s.severity),`SEVERITY_${i}`);check(Number.isFinite(s.priority),`PRIORITY_${i}`);check(s.repeatPolicy==='COUNT_ON_DELIVERY_CYCLE',`REPEAT_${i}`);check(Number.isFinite(s.cooldownMs),`COOLDOWN_${i}`);check(Number.isFinite(s.maximumRepeats),`MAX_${i}`);check(Boolean(s.ackPolicy),`ACK_${i}`);check(Number.isFinite(s.expirationMs),`EXPIRY_${i}`);check(Boolean(s.speechAsset),`ASSET_${i}`);check(Boolean(s.ttsTextKo),`TTS_${i}`);check(Boolean(s.tonePattern),`TONE_${i}`);check(s.simulation===true&&s.actuatorConnected===false&&s.operationalUseAllowed===false,`GUARDS_${i}`)});
let now=1000,deliveries=[];const runtime=new R({now:()=>now,deliver:async s=>{deliveries.push(s.id);return{deliveryState:'PLAYED'}}}),target='driver-1';let state=runtime.transition({canonicalTargetId:target,transitionType:'ACTIVE_SET',scenarioIds:['DROWSINESS_LEVEL_1']});check(state.currentScenario==='DROWSINESS_LEVEL_1','DROWSINESS_SELECT');check(state.currentEscalationLevel===1,'LEVEL_1');check(Boolean(state.nextEscalationAt),'NEXT_ESCALATION');let delivered=await runtime.deliverPrimary(target);check(delivered.repeatCount===1,'DELIVER_ONCE');check(deliveries.length===1,'ONE_DELIVERY');check(runtime.getHistory(target).some(x=>x.eventType==='PLAYBACK_COMPLETED'),'HISTORY_COMPLETION');state=runtime.transition({canonicalTargetId:target,transitionType:'ACTIVE_SET',scenarioIds:['DROWSINESS_LEVEL_1']});check(state.currentScenario===null&&state.reason==='COOLDOWN','COOLDOWN_SUPPRESSION');check(state.suppressedMessages[0].reason==='COOLDOWN','COOLDOWN_REASON');now+=5001;state=runtime.transition({canonicalTargetId:target,transitionType:'ACTIVE_SET',scenarioIds:['DROWSINESS_LEVEL_1']});check(state.currentScenario==='DROWSINESS_LEVEL_1','COOLDOWN_RECOVERY');now+=5001;state=runtime.tick(target);check(state.currentScenario==='DROWSINESS_LEVEL_2','TIME_ESCALATION');check(state.currentEscalationLevel===2,'LEVEL_2');now+=10001;state=runtime.tick(target);check(state.currentScenario==='DROWSINESS_LEVEL_3','LEVEL_3_SCENARIO');check(state.currentEscalationLevel===3,'LEVEL_3');now+=20001;state=runtime.tick(target);check(state.currentScenario==='INCAPACITATION_SUSPECTED','EVENT_ESCALATION_TARGET');check(state.currentEscalationLevel===4,'LEVEL_4');check(runtime.getHistory(target).filter(x=>x.eventType==='SCENARIO_ESCALATED').length===3,'ESCALATION_HISTORY');
const r2=new R({now:()=>now}),t2='driver-2';state=r2.transition({canonicalTargetId:t2,transitionType:'ACTIVE_SET',scenarioIds:['DROWSINESS_LEVEL_1','RIGHT_TURN_PEDESTRIAN','PEDESTRIAN_TOO_CLOSE','FRONT_COLLISION_WARNING','ALCOHOL_DETECTED']});check(state.currentScenario==='FRONT_COLLISION_WARNING','COLLISION_PRIMARY');check(state.queue[0]==='PEDESTRIAN_TOO_CLOSE','PEDESTRIAN_SECOND');check(state.queue.includes('ALCOHOL_DETECTED'),'ALCOHOL_QUEUED');check(state.queue.includes('RIGHT_TURN_PEDESTRIAN'),'RIGHT_TURN_QUEUED');check(state.suppressedMessages.some(x=>x.scenarioId==='DROWSINESS_LEVEL_1'),'DROWSINESS_SUPPRESSED');check(state.suppressedMessages.find(x=>x.scenarioId==='DROWSINESS_LEVEL_1').reason==='HIGHER_HAZARD_SUPPRESSES_DROWSINESS','HAZARD_SUPPRESSION_REASON');
const r3=new R({now:()=>now}),t3='driver-3';r3.transition({canonicalTargetId:t3,transitionType:'ACTIVE_SET',scenarioIds:['INCAPACITATION_SUSPECTED']});let ack=r3.acknowledge(t3,{source:'PHYSICAL_BUTTON',kind:'ACK'});check(ack.riskCleared===false,'ACK_NO_RISK_CLEAR');check(ack.ackSource==='PHYSICAL_BUTTON','PHYSICAL_ACK');state=r3.getState(t3);check(state.currentScenario===null,'ACK_SUPPRESSED_CURRENT');check(state.suppressedMessages[0].reason==='ACK_SUPPRESSION','ACK_REASON');check(r3.getHistory(t3).some(x=>x.eventType==='SCENARIO_ACKNOWLEDGED'),'ACK_HISTORY');now+=10001;state=r3.transition({canonicalTargetId:t3,transitionType:'ACTIVE_SET',scenarioIds:['INCAPACITATION_SUSPECTED']});check(state.currentScenario==='INCAPACITATION_SUSPECTED','ACK_EXPIRY');state=r3.timeout(t3);check(state.currentScenario==='INCAPACITATION_NO_RESPONSE','TIMEOUT_ESCALATES');check(r3.getHistory(t3).some(x=>x.eventType==='ACK_TIMEOUT'),'TIMEOUT_HISTORY');
const r4=new R({now:()=>now}),t4='driver-4';r4.transition({canonicalTargetId:t4,transitionType:'ACTIVE_SET',scenarioIds:['SYSTEM_READY']});await r4.deliverPrimary(t4);now+=60001;r4.transition({canonicalTargetId:t4,transitionType:'ACTIVE_SET',scenarioIds:['SYSTEM_READY']});state=r4.getState(t4);check(state.currentScenario===null&&state.reason==='MAXIMUM_REPEATS','MAX_REPEAT_SUPPRESSION');state=r4.transition({canonicalTargetId:t4,transitionType:'CLEAR'});check(state.reason==='CLEARED'&&state.currentScenario===null,'CLEAR');check(r4.getHistory(t4).some(x=>x.eventType==='SCENARIO_CANCELLED'),'CANCEL_HISTORY');state=r4.reset(t4);check(state.currentScenario===null,'RESET');
const source=[R.toString(),JSON.stringify(P.list())].join(' ');check(!/getUserMedia|SpeechRecognition|mediaDevices/.test(source),'NO_MICROPHONE');check(!/localStorage|sessionStorage|indexedDB/.test(source),'NO_STORAGE');check(!/fetch\s*\(|XMLHttpRequest|WebSocket/.test(source),'NO_CLOUD');check(!/brake|steer|vehicleControl/i.test(source),'NO_VEHICLE_CONTROL');check(P.list().every(x=>x.operationalUseAllowed===false),'ALL_NON_OPERATIONAL');check(P.list().every(x=>x.actuatorConnected===false),'ALL_ACTUATORS_FALSE');check(pass.length>=240,'MINIMUM_240');document.title=`PASS - Driver Voice Scenario Runtime (${pass.length})`;results.textContent=pass.join('\n')})().catch(e=>{document.title='FAIL - Driver Voice Scenario Runtime';results.textContent=e.stack;throw e})</script></body></html>
