<script>(()=>{'use strict';const passed=[],check=(value,name)=>{if(!value)throw Error(name);passed.push(name)},throws=(fn,name)=>{let yes=false;try{fn()}catch(_){yes=true}check(yes,name)};let now=Date.parse('2026-08-03T12:00:00Z'),seq=0;const registry=new RuntimeIdentityRegistry.IdentityRegistry({now:()=>now}),identity=registry.registerIdentity({vehicleId:'vehicle-a',vehicleType:'FORKLIFT',driverId:'driver-a',driverAssignmentId:'assignment-a',ownershipToken:'owner-a',sensorIds:['attention-a'],cameraIds:['camera-a'],runtimeSources:['DRIVER_CAMERA'],targetAliases:['attention-target-a'],simulation:true}).identity,other=registry.registerIdentity({vehicleId:'vehicle-b',vehicleType:'FORKLIFT',driverId:'driver-b',driverAssignmentId:'assignment-b',ownershipToken:'owner-b',sensorIds:['attention-b'],cameraIds:['camera-b'],runtimeSources:['DRIVER_CAMERA'],targetAliases:[],simulation:true}).identity;
const base=(overrides={})=>({measurementId:`measurement-${++seq}`,timestamp:new Date(now).toISOString(),sensorId:'attention-a',sourceType:'FIXTURE',targetId:identity.canonicalTargetId,canonicalTargetId:identity.canonicalTargetId,gazeDirection:'FORWARD',gazeSource:'FIXTURE',headDirection:'CENTER',roadAttentionZone:'ROAD_FORWARD',glanceDurationMs:0,offRoadDurationMs:0,forwardAttentionDurationMs:0,faceDetected:true,landmarkValid:true,gazeValid:true,headPoseValid:true,pitch:0,yaw:0,roll:0,measurementConfidence:.8,sampleAgeMs:0,sensorConnected:true,quality:{fixture:true},reasonCodes:[],simulation:true,...overrides});
let m=new DriverAttentionRuntime.DriverAttentionMeasurement(base());check(Object.isFrozen(m)&&Object.isFrozen(m.quality),'MODEL_IMMUTABLE');check(m.operationalUseAllowed===false&&m.simulation===true,'MODEL_SAFETY_FLAGS');check(JSON.parse(JSON.stringify(m)).measurementId===m.measurementId,'MODEL_JSON_SAFE');check(m.distractionSource==='UNKNOWN'&&!m.sourceEvidenceAvailable,'PHONE_BOUNDARY_DEFAULT');check(m.measurementConfidence===.8,'MODEL_CONFIDENCE');check(new DriverAttentionRuntime.DriverAttentionMeasurement(base({measurementConfidence:null})).measurementConfidence===null,'NULL_CONFIDENCE');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement(base({glanceDurationMs:-1})),'NEGATIVE_DURATION_REJECTED');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement(base({pitch:Infinity})),'INFINITE_REJECTED');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement(base({yaw:NaN})),'NAN_REJECTED');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement({...base(),frame:{}}),'FRAME_PRIVACY_REJECTED');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement({...base(),landmarks:[]}), 'LANDMARK_PRIVACY_REJECTED');throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement({...base(),faceCrop:'x'}),'FACE_CROP_PRIVACY_REJECTED');
DriverAttentionRuntime.GazeDirection.forEach(value=>check(new DriverAttentionRuntime.DriverAttentionMeasurement(base({gazeDirection:value})).gazeDirection===value,`GAZE_${value}`));DriverAttentionRuntime.HeadDirection.forEach(value=>check(new DriverAttentionRuntime.DriverAttentionMeasurement(base({headDirection:value})).headDirection===value,`HEAD_${value}`));DriverAttentionRuntime.AttentionZone.forEach(value=>check(new DriverAttentionRuntime.DriverAttentionMeasurement(base({roadAttentionZone:value})).roadAttentionZone===value,`ZONE_${value}`));DriverAttentionRuntime.SourceType.forEach(value=>check(new DriverAttentionRuntime.DriverAttentionMeasurement(base({sourceType:value,gazeSource:value})).sourceType===value,`SOURCE_${value}`));throws(()=>new DriverAttentionRuntime.DriverAttentionMeasurement(base({gazeDirection:'PHONE'})),'INVALID_GAZE_REJECTED');const heuristic=new DriverAttentionRuntime.DriverAttentionMeasurement(base({sourceType:'HEAD_POSE_HEURISTIC',gazeSource:'HEAD_POSE_HEURISTIC',gazeValid:false,headPoseValid:true}));check(!heuristic.gazeValid&&heuristic.headPoseValid&&heuristic.gazeSource==='HEAD_POSE_HEURISTIC','HEAD_POSE_EYE_GAZE_SEPARATION');
const fusion=new MultiHazardFusionEngine.FusionEngine({identityRegistry:registry,now:()=>now,scheduler:null}),confidence=new RuntimeConfidenceEngine.Engine({now:()=>now}),runtime=new DriverAttentionRuntime.Runtime({identityRegistry:registry,fusionEngine:fusion,confidenceEngine:confidence,now:()=>now});let out=runtime.ingest(base());check(out.attentionState==='ATTENTIVE','STATE_ATTENTIVE');check(out.observation.observationType==='DRIVER_ATTENTION'&&out.observation.value==='ATTENTIVE','ATTENTION_OBSERVATION');check(out.observation.metadata.canonicalTargetId===identity.canonicalTargetId,'OBSERVATION_CANONICAL_TARGET');check(out.observation.metadata.operationalUseAllowed===false,'OBSERVATION_SAFETY');now+=100;out=runtime.ingest(base({gazeDirection:'LEFT',headDirection:'LEFT',roadAttentionZone:'MIRROR_LEFT',glanceDurationMs:100,offRoadDurationMs:100,forwardAttentionDurationMs:0}));check(out.attentionState==='BRIEF_GLANCE_AWAY'&&!out.riskEvent,'BRIEF_LEFT_NO_RISK');now+=400;out=runtime.ingest(base({gazeDirection:'RIGHT',headDirection:'RIGHT',roadAttentionZone:'MIRROR_RIGHT',glanceDurationMs:500,offRoadDurationMs:500}));check(out.attentionState==='DISTRACTION_PENDING'&&!out.riskEvent,'ENTRY_PENDING_NO_RISK');now+=1400;out=runtime.ingest(base({gazeDirection:'DOWN',headDirection:'DOWN',roadAttentionZone:'DOWN_OFF_ROAD',glanceDurationMs:1900,offRoadDurationMs:1900}));check(out.attentionState==='DISTRACTED'&&out.riskEvent.eventType==='DRIVER_DISTRACTION','SUSTAIN_TO_DISTRACTED');check(out.riskSignal.reasonCodes.includes('PROLONGED_DOWNWARD_GLANCE'),'DOWNWARD_REASON');check(out.fusion.compositeRisk.contributingRiskTypes.includes('DRIVER_DISTRACTION'),'FUSION_DISTRACTION_ONLY');check(out.fusion.compositeRisk.priorityBand==='WARNING','DISTRACTION_WARNING');check(out.confidence.runtimeConfidence.reasonCodes.includes('MEASUREMENT_VALID'),'ATTENTION_CONFIDENCE');check(runtime.acknowledge(identity.canonicalTargetId).state==='ACKNOWLEDGED','ACK_SUPPORTED');check(runtime.getState(identity.canonicalTargetId).activeRisk===true,'ACK_DOES_NOT_CLEAR');now+=100;out=runtime.ingest(base({forwardAttentionDurationMs:100}));check(out.attentionState==='RECOVERING','STATE_RECOVERING');now+=900;out=runtime.ingest(base({forwardAttentionDurationMs:1000}));check(out.attentionState==='ATTENTIVE','RECOVERY_SUSTAIN_CLEAR');
now+=10;out=runtime.ingest(base({faceDetected:false,landmarkValid:false,gazeValid:false,headPoseValid:false,gazeDirection:'UNKNOWN',headDirection:'UNKNOWN',roadAttentionZone:'UNKNOWN'}));check(out.attentionState==='INVALID','FACE_LOSS_INVALID');check(out.riskSignal.shouldClearRisk===false,'QUALITY_DOES_NOT_CLEAR');now+=10;out=runtime.ingest(base({landmarkValid:false,gazeValid:false,headPoseValid:false,gazeDirection:'UNKNOWN',headDirection:'UNKNOWN',roadAttentionZone:'UNKNOWN'}));check(out.attentionState==='INVALID','LANDMARK_INVALID_STATE');now+=10;out=runtime.ingest(base({sampleAgeMs:2000,gazeDirection:'UNKNOWN',headDirection:'UNKNOWN',roadAttentionZone:'UNKNOWN'}));check(out.attentionState==='UNKNOWN','STALE_UNKNOWN');now+=10;out=runtime.ingest(base({sensorConnected:false,gazeDirection:'UNKNOWN',headDirection:'UNKNOWN',roadAttentionZone:'UNKNOWN'}));check(out.attentionState==='UNKNOWN','OFFLINE_UNKNOWN');const beforeAudit=runtime.getAuditHistory().length,outDuplicate=runtime.ingest({...base(),measurementId:out.measurement.measurementId,timestamp:out.measurement.timestamp});check(outDuplicate.measurement.measurementId===out.measurement.measurementId&&runtime.getAuditHistory().length===beforeAudit+1,'DUPLICATE_DEDUP');
throws(()=>runtime.ingest(base({sensorId:'unknown-sensor'})),'UNKNOWN_SENSOR_REJECTED');throws(()=>runtime.ingest(base({sensorId:'attention-b'})),'OWNERSHIP_TARGET_REJECTED');const runtimeB=new DriverAttentionRuntime.Runtime({identityRegistry:registry,now:()=>now});const outB=runtimeB.ingest(base({sensorId:'attention-b',targetId:other.canonicalTargetId,canonicalTargetId:other.canonicalTargetId}));check(outB.attentionState==='ATTENTIVE'&&runtime.getState(identity.canonicalTargetId)!==null,'MULTI_TARGET_ISOLATION');check(identity.driverAssignmentId!==other.driverAssignmentId,'ASSIGNMENT_ISOLATION');runtime.reset(identity.canonicalTargetId);check(runtime.getState(identity.canonicalTargetId)===null&&runtime.getAuditHistory(identity.canonicalTargetId).some(x=>x.eventType==='TARGET_RESET'),'RESET_TARGET');
const risk=(type,id)=>({eventId:id,eventType:type,targetId:identity.canonicalTargetId,severity:'HIGH',state:'ACTIVE',createdTime:new Date(now).toISOString(),updatedTime:new Date(now).toISOString(),simulation:true,operationalContext:identity}),condition=(type,id)=>({conditionId:id,conditionType:type,targetId:identity.canonicalTargetId,driverAssignmentId:identity.driverAssignmentId,value:true,timestamp:new Date(now).toISOString(),validUntil:new Date(now+5000).toISOString(),quality:{confidenceAvailable:false},confidence:null,simulation:true,operationalContext:identity});const makeFusion=()=>new MultiHazardFusionEngine.FusionEngine({identityRegistry:registry,now:()=>now,scheduler:null});let f=makeFusion();f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fd1'));let fused=f.ingestRiskEvent(risk('DROWSINESS','fd2'));check(fused.compositeRisk.synergyRules.includes('SYNERGY-DISTRACTION-DROWSINESS'),'FUSION_DROWSINESS');f=makeFusion();f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fa1'));fused=f.ingestRiskEvent(risk('ALCOHOL_POLICY_VIOLATION','fa2'));check(fused.compositeRisk.synergyRules.includes('SYNERGY-DISTRACTION-ALCOHOL'),'FUSION_ALCOHOL');f=makeFusion();f.ingestCondition(condition('ATTENTION_HAZARD_RELATED','cp'));f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fp1'));fused=f.ingestRiskEvent(risk('HUMAN_PROXIMITY','fp2'));check(fused.compositeRisk.synergyRules.includes('SYNERGY-DISTRACTION-PEDESTRIAN-RELATED'),'FUSION_PEDESTRIAN_RELATED');f=makeFusion();f.ingestCondition(condition('ATTENTION_HAZARD_RELATED','cv'));f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fv1'));fused=f.ingestRiskEvent(risk('VEHICLE_PROXIMITY','fv2'));check(fused.compositeRisk.synergyRules.includes('SYNERGY-DISTRACTION-VEHICLE-RELATED'),'FUSION_VEHICLE_RELATED');f=makeFusion();f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fu1'));fused=f.ingestRiskEvent(risk('HUMAN_PROXIMITY','fu2'));check(!fused.compositeRisk.synergyRules.includes('SYNERGY-DISTRACTION-PEDESTRIAN-RELATED'),'UNRELATED_NO_ARTIFICIAL_SYNERGY');f=makeFusion();f.ingestCondition(condition('RIGHT_TURN_ACTIVE','rt'));f.ingestCondition(condition('ATTENTION_HAZARD_RELATED','ar'));f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fr1'));fused=f.ingestRiskEvent(risk('HUMAN_PROXIMITY','fr2'));check(fused.compositeRisk.priorityBand==='CRITICAL'&&fused.compositeRisk.synergyRules.includes('SYNERGY-RIGHT-TURN-DISTRACTION-PEDESTRIAN'),'RIGHT_TURN_TRIPLE_CRITICAL');f=makeFusion();f.ingestRiskEvent(risk('DRIVER_DISTRACTION','fi1'));fused=f.ingestRiskEvent(risk('DRIVER_INCAPACITATION','fi2'));check(fused.compositeRisk.dominantRiskType==='DRIVER_INCAPACITATION'&&fused.context.activeRiskTypes.includes('DRIVER_DISTRACTION'),'INCAPACITATION_DOMINANT_RETAINS_DISTRACTION');
const c=new RuntimeConfidenceEngine.Engine({now:()=>now}),confidenceInput=(measurement,agreement='SINGLE_SOURCE')=>c.evaluate({operationalContext:{contextId:'c1',canonicalTargetId:identity.canonicalTargetId},compositeRisk:{compositeRiskId:'cr1',priorityScore:90,priorityBand:'CRITICAL',recommendedActions:['SAFE_STOP_REQUEST']},canonicalIdentity:identity,observations:[{timestamp:new Date(now).toISOString()}],sensorStates:[{status:'ONLINE'}],evidence:{measurement,sampleAgeMs:0,context:{requiredEvidence:['DIRECTION'],availableEvidence:['DIRECTION']},agreement:{agreementStatus:agreement}}});let co=confidenceInput({faceDetected:true,landmarkValid:true,headPoseValid:true,gazeValid:false,measurementConfidence:.5});check(co.runtimeConfidence.reasonCodes.includes('HEAD_POSE_ONLY')&&co.runtimeConfidence.measurementConfidence<=60,'HEAD_POSE_LIMITED_CONFIDENCE');co=confidenceInput({faceDetected:true,landmarkValid:true,headPoseValid:true,gazeValid:true,measurementConfidence:.9},'AGREEMENT');check(co.runtimeConfidence.agreementConfidence===100,'GAZE_HEAD_AGREEMENT');co=confidenceInput({faceDetected:true,landmarkValid:true,headPoseValid:true,gazeValid:true,measurementConfidence:.9},'DISAGREEMENT');check(co.runtimeConfidence.reasonCodes.includes('SENSOR_DISAGREEMENT'),'GAZE_HEAD_DISAGREEMENT');co=confidenceInput({faceDetected:false,landmarkValid:false,headPoseValid:false,gazeValid:false,measurementConfidence:null});check(co.runtimeConfidence.reasonCodes.includes('FACE_NOT_DETECTED'),'CONFIDENCE_FACE_LOSS');
const lineage=runtimeB.getLineage();check(lineage.nodes.some(x=>x.nodeType==='DriverAttentionMeasurement'),'LINEAGE_MEASUREMENT_NODE');check(lineage.nodes.some(x=>x.nodeType==='DriverAttentionObservation'),'LINEAGE_OBSERVATION_NODE');check(lineage.edges.some(x=>x.relation==='MEASUREMENT_GENERATED'),'LINEAGE_MEASUREMENT_OBSERVATION');check(lineage.triples.some(x=>x.predicate==='hasGazeDirection'),'TRIPLE_GAZE');check(lineage.triples.some(x=>x.predicate==='appliesToCanonicalTarget'),'TRIPLE_CANONICAL_TARGET');check(runtimeB.exportJSON(other.canonicalTargetId).includes('DEVELOPMENT_UNVALIDATED_DRIVER_ATTENTION_CANDIDATE-v1'),'VERSIONED_CONFIG_EXPORT');const source=DriverAttentionRuntime.Runtime.toString()+DriverAttentionRuntime.DriverAttentionMeasurement.toString();check(!/fetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon|MQTT|GPIO|\bBLE\b|Serial|getUserMedia|localStorage|sessionStorage|indexedDB/.test(source),'NO_NETWORK_HARDWARE_STORAGE');check(!/phoneDetector|objectDetector|boundingBox|bbox/.test(source),'NO_PHONE_DETECTOR');check(!/actuatorConnected\s*=\s*true|dispatchActuator|vehicleControl/.test(source),'NO_ACTUATOR_CONTROL');check(passed.length>=60,'MINIMUM_60_ASSERTIONS');document.title=`PASS - Driver Attention Runtime (${passed.length})`;result.textContent=passed.join('\n')})()</script></body></html>
