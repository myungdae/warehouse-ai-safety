<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Driver Perception Metrics Tests</title></head>
<body><pre id="results"></pre>
<script src="../backend/static/js/driver_perception/driver_perception_config.js"></script>
<script src="../backend/static/js/driver_perception/driver_calibration.js"></script>
<script src="../backend/static/js/driver_perception/driver_metric_calculator.js"></script>
<script src="../backend/static/js/driver_perception/driver_metric_snapshot.js"></script>
<script src="../backend/static/js/driver_perception/camera_manager.js"></script>
<script src="../backend/static/js/driver_perception/face_landmark_adapter.js"></script>
<script src="../backend/static/js/driver_perception/driver_perception_runtime.js"></script>
<script>
(function run() {
  'use strict';
  const results=[]; const test=(name,fn)=>{try{fn();results.push({name,pass:true});}catch(error){results.push({name,pass:false,error:error.message});}};
  const assert=(condition,message)=>{if(!condition)throw new Error(message);};
  const close=(actual,expected,tolerance=.001)=>assert(Math.abs(actual-expected)<=tolerance,`${actual} != ${expected}`);
  const config={...DriverPerception.Config.metrics,smoothingAlpha:1,perclosWindowMs:1000,minimumPerclosValidMs:100,minimumPerclosValidRatio:.5,maxFrameGapMs:500,blink:{minimumDurationMs:80,maximumDurationMs:500,rateWindowMs:60000},headPose:{downDegrees:20,upDegrees:-10,yawDegrees:18}};
  const landmarks=(ear=.3,{noseX=.5,noseY=.45,leftX=.3,rightX=.7}={})=>{
    const points=Array.from({length:478},()=>({x:.5,y:.5,z:0}));
    const eye=(indices,cx)=>{const h=.2,v=ear*h;const values=[[cx-h/2,.4],[cx-.04,.4-v/2],[cx+.04,.4-v/2],[cx+h/2,.4],[cx+.04,.4+v/2],[cx-.04,.4+v/2]];indices.forEach((index,i)=>points[index]={x:values[i][0],y:values[i][1],z:0});};
    eye(config.leftEyeIndices,leftX);eye(config.rightEyeIndices,rightX);points[1]={x:noseX,y:noseY,z:-.05};return points;
  };
  const frame=(ms,ear=.3,options={})=>({timestamp:new Date(ms).toISOString(),cameraId:'cam-1',faceDetected:options.faceDetected!==false,landmarks:options.faceDetected===false?null:landmarks(ear,options),imageWidth:640,imageHeight:480,processingTimeMs:4,status:'LANDMARKS_AVAILABLE'});
  const ready={state:'READY',calibrated:true,baseline:.3,threshold:.225};

  test('normal open EAR',()=>{const value=DriverPerception.DriverMetricCalculator.computeEyeEAR(landmarks(.3),config.leftEyeIndices);close(value,.3);});
  test('closed EAR',()=>{const value=DriverPerception.DriverMetricCalculator.computeEyeEAR(landmarks(.1),config.leftEyeIndices);close(value,.1);});
  test('left and right are independent',()=>{const points=landmarks(.3);const right=config.rightEyeIndices;points[right[1]].y=.39;points[right[5]].y=.41;const left=DriverPerception.DriverMetricCalculator.computeEyeEAR(points,config.leftEyeIndices);const value=DriverPerception.DriverMetricCalculator.computeEyeEAR(points,right);assert(left!==value,'eyes must be separate');});
  test('invalid landmark',()=>assert(DriverPerception.DriverMetricCalculator.computeEyeEAR([],config.leftEyeIndices)===null,'invalid must be null'));
  test('zero distance',()=>{const points=landmarks(.3);points[config.leftEyeIndices[3]]={...points[config.leftEyeIndices[0]]};assert(DriverPerception.DriverMetricCalculator.computeEyeEAR(points,config.leftEyeIndices)===null,'zero distance accepted');});
  test('NaN defense',()=>{const points=landmarks(.3);points[config.leftEyeIndices[1]].x=NaN;assert(DriverPerception.DriverMetricCalculator.computeEyeEAR(points,config.leftEyeIndices)===null,'NaN accepted');});

  test('calibration valid samples and READY',()=>{const calibration=new DriverPerception.DriverCalibration({durationMs:100,minimumSamples:3,minimumOpenEar:.18,minimumBaseline:.18,thresholdRatio:.75});calibration.start(0);calibration.addSample(.29,{timestamp:10});calibration.addSample(.3,{timestamp:20});calibration.addSample(.31,{timestamp:100});const state=calibration.getState(100);assert(state.state==='READY'&&state.sampleCount===3,'not ready');close(state.baseline,.3);close(state.threshold,.225);});
  test('calibration rejects invalid and closed samples',()=>{const calibration=new DriverPerception.DriverCalibration({durationMs:100,minimumSamples:1,minimumOpenEar:.18,minimumBaseline:.18,thresholdRatio:.75});calibration.start(0);calibration.addSample(null,{valid:false,timestamp:10});calibration.addSample(.1,{timestamp:20});calibration.addSample(.3,{timestamp:100});const state=calibration.getState(100);assert(state.rejectedSampleCount===2&&state.sampleCount===1&&state.state==='READY','rejection mismatch');});
  test('calibration invalid for too few samples',()=>{const calibration=new DriverPerception.DriverCalibration({durationMs:10,minimumSamples:2,minimumOpenEar:.18,minimumBaseline:.18,thresholdRatio:.75});calibration.start(0);calibration.addSample(.3,{timestamp:10});assert(calibration.getState(10).state==='INVALID','must be invalid');});
  test('calibration reset',()=>{const calibration=new DriverPerception.DriverCalibration({durationMs:1,minimumSamples:1,minimumOpenEar:.1,minimumBaseline:.1,thresholdRatio:.75});calibration.start(0);calibration.addSample(.3,{timestamp:1});calibration.reset();const state=calibration.getState();assert(state.state==='RESET'&&state.baseline===null&&state.sampleCount===0,'reset failed');});

  test('normal blink counts once',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(100,.1),ready);calc.processFrame(frame(250,.3),ready);const value=calc.processFrame(frame(300,.3),ready);assert(value.blinkCount===1&&value.lastBlinkDurationMs===150,'blink mismatch');});
  test('short closure excluded',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(100,.1),ready);const value=calc.processFrame(frame(150,.3),ready);assert(value.blinkCount===0,'short blink counted');});
  test('long closure separated from blink',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(100,.1),ready);const value=calc.processFrame(frame(700,.3),ready);assert(value.blinkCount===0&&value.lastBlinkDurationMs===null,'long closure counted');});
  test('missing face cannot create blink',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(100,.1),ready);calc.processFrame(frame(150,.3,{faceDetected:false}),ready);const value=calc.processFrame(frame(250,.3),ready);assert(value.blinkCount===0,'missing face created blink');});

  test('time based PERCLOS',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(200,.1),ready);calc.processFrame(frame(600,.3),ready);const value=calc.processFrame(frame(1000,.3),ready);close(value.perclos,40,.01);assert(value.perclosValid,'perclos invalid');});
  test('PERCLOS similar across FPS',()=>{const run=step=>{const calc=new DriverPerception.DriverMetricCalculator(config);for(let time=0;time<=1000;time+=step)calc.processFrame(frame(time,time>=200&&time<600?.1:.3),ready);return calc.processFrame(frame(1000,.3),ready).perclos;};close(run(100),run(200),.01);});
  test('invalid frames excluded',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.1),ready);calc.processFrame(frame(200,.1,{faceDetected:false}),ready);calc.processFrame(frame(400,.3),ready);const value=calc.processFrame(frame(600,.3),ready);assert(value.closedEyeTimeMs===200&&value.validEyeTimeMs===400,'invalid interval included');});
  test('PERCLOS window pruning',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);calc.processFrame(frame(0,.1),ready);calc.processFrame(frame(500,.1),ready);calc.processFrame(frame(1000,.3),ready);const value=calc.processFrame(frame(1500,.3),ready);close(value.perclos,50,.01);assert(value.validEyeTimeMs===1000,'window not pruned');});
  test('insufficient valid ratio',()=>{const local={...config,minimumPerclosValidRatio:.9};const calc=new DriverPerception.DriverMetricCalculator(local);calc.processFrame(frame(0,.3),ready);calc.processFrame(frame(100,.3,{faceDetected:false}),ready);calc.processFrame(frame(900,.3),ready);const value=calc.processFrame(frame(1000,.3),ready);assert(!value.perclosValid,'low valid ratio accepted');});

  test('head pose center down left right',()=>{const calc=()=>new DriverPerception.DriverMetricCalculator(config);assert(calc().processFrame(frame(0,.3,{noseX:.5,noseY:.45}),ready).headPoseState==='CENTER','center');assert(calc().processFrame(frame(0,.3,{noseX:.5,noseY:.65}),ready).headPoseState==='DOWN','down');assert(calc().processFrame(frame(0,.3,{noseX:.2,noseY:.45}),ready).headPoseState==='LEFT','left');assert(calc().processFrame(frame(0,.3,{noseX:.8,noseY:.45}),ready).headPoseState==='RIGHT','right');});
  test('head pose invalid',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);const value=calc.processFrame(frame(0,.3,{faceDetected:false}),ready);assert(!value.headPoseValid&&value.headPoseState==='UNKNOWN','invalid pose');});

  test('snapshot is JSON safe and private',()=>{const calc=new DriverPerception.DriverMetricCalculator(config);const source=frame(0,.3);const metrics=calc.processFrame(source,ready);const snapshot=DriverPerception.createDriverMetricSnapshot({frame:source,metrics,calibration:ready,now:100});const json=JSON.stringify(snapshot);assert(!json.includes('landmarks')&&!json.includes('multiFace')&&!json.includes('video'),'raw data leaked');assert(snapshot.privacy.imageStored===false&&snapshot.privacy.imageTransmitted===false&&!snapshot.operationalUseAllowed,'privacy mismatch');assert(Object.isFrozen(snapshot)&&Object.isFrozen(snapshot.metrics),'snapshot mutable');assert(snapshot.diagnostics.eye.calibrated&&snapshot.diagnostics.eye.blinkRejectReason==='NONE'&&snapshot.diagnostics.eye.leftEAR!==null&&snapshot.diagnostics.eye.rightEAR!==null,'blink gate diagnostics missing');assert(typeof snapshot.diagnostics.mouth.marInvalidReason==='string'&&Array.isArray(snapshot.diagnostics.mouth.marInvalidReasons)&&snapshot.diagnostics.mouth.pitchLimit===30&&snapshot.diagnostics.mouth.yawLimit===30&&snapshot.diagnostics.mouth.rollLimit===25,'MAR gate diagnostics missing');});
  test('runtime exposes metric and calibration API',()=>{const camera={permissionState:'UNKNOWN'};const landmark={};const calc=new DriverPerception.DriverMetricCalculator(config);const calibration=new DriverPerception.DriverCalibration({durationMs:10,minimumSamples:1,minimumOpenEar:.1,minimumBaseline:.1,thresholdRatio:.75});const runtime=new DriverPerception.DriverPerceptionRuntime({cameraManager:camera,landmarkAdapter:landmark,metricCalculator:calc,calibration,snapshotFactory:DriverPerception.createDriverMetricSnapshot,scheduler:()=>0,cancelScheduler:()=>{}});assert(runtime.getLatestMetricSnapshot()===null,'latest must start null');assert(typeof runtime.onMetricSnapshot==='function'&&runtime.startCalibration(0).state==='COLLECTING','public API missing');assert(runtime.getCalibrationState(0).state==='COLLECTING','calibration state missing');assert(runtime.resetCalibration().state==='RESET','reset API failed');});

  const passCount=results.filter(result=>result.pass).length;document.getElementById('results').textContent=JSON.stringify({pass:passCount===results.length,passCount,total:results.length,results},null,2);document.title=`${passCount}/${results.length} Driver Perception Metrics Tests`;
})();
</script></body></html>
