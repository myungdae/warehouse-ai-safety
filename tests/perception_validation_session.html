<!doctype html><html><head><meta charset="utf-8"><title>Perception Validation Session</title></head><body><pre id="result"></pre><script src="../backend/static/js/driver_perception/perception_validation_session.js"></script><script src="../backend/static/js/driver_perception/perception_episode_validator.js"></script><script src="../backend/static/js/driver_perception/perception_threshold_comparator.js"></script><script>(()=>{'use strict';const pass=[],fail=[],check=(v,n)=>{(v?pass:fail).push(n)},throws=(fn,n)=>{let yes=false;try{fn()}catch(_){yes=true}check(yes,n)};const V=DriverPerception.PerceptionValidation,base=Date.parse('2026-08-04T00:00:00Z');let now=base;const target='FORKLIFT-VAL|DRIVER-VAL|ASSIGNMENT-VAL',assignment='ASSIGNMENT-VAL',at=ms=>new Date(base+ms).toISOString();
check(V.SessionState.length===7,'SESSION_STATES');check(V.ValidationState.length===3,'VALIDATION_STATES');check(V.EpisodeType.length===9,'EPISODE_TYPES');check(V.EpisodeDecision.length===4,'DECISIONS');check(V.EpisodeState.length===6,'EPISODE_STATES');check(V.Annotation.length===18,'ANNOTATIONS');check(!V.ValidationState.includes('APPROVED'),'NO_APPROVED_STATE');check(!V.ValidationState.includes('FIELD_VERIFIED'),'NO_FIELD_VERIFIED');
const session=new V.PerceptionValidationSession({validationSessionId:'validation-1',canonicalTargetId:target,assignmentId:assignment,vehicleType:'FORKLIFT',cameraPosition:'DRIVER_FRONT',lightingCondition:'NORMAL',glassesMode:'WITHOUT_GLASSES',operatorLabel:'OP-A',state:'READY'});check(Object.isFrozen(session),'SESSION_IMMUTABLE');check(session.operationalUseAllowed===false,'SESSION_OPERATIONAL_FALSE');check(session.simulation===true,'SESSION_SIMULATION');check(session.validationState==='NOT_VALIDATED','SESSION_NOT_VALIDATED');check(JSON.parse(JSON.stringify(session)).validationSessionId==='validation-1','SESSION_JSON');throws(()=>new V.PerceptionValidationSession({...session.toJSON(),state:'BAD'}),'BAD_SESSION_STATE');throws(()=>new V.PerceptionValidationSession({...session.toJSON(),durationMs:Infinity}),'SESSION_INFINITY');throws(()=>new V.PerceptionValidationSession({...session.toJSON(),image:'bad'}),'SESSION_IMAGE_REJECT');
const episodeInput=(id,type,duration,measuredValues={},thresholdsUsed={})=>({episodeId:id,episodeType:type,startedAt:at(100),endedAt:at(100+duration),durationMs:duration,sourceSnapshotIds:['snapshot-1'],sourceMetricSequence:[1],state:'COMPLETED',decision:'UNDECIDED',measuredValues,thresholdsUsed,quality:{fixture:true},acceptReasonCodes:[],rejectReasonCodes:[],createdAt:at(100+duration)});const episode=new V.PerceptionEpisode(episodeInput('episode-1','BLINK',150));check(Object.isFrozen(episode),'EPISODE_IMMUTABLE');check(episode.operationalUseAllowed===false,'EPISODE_OPERATIONAL_FALSE');check(episode.sourceSnapshotIds[0]==='snapshot-1','EPISODE_LINEAGE');throws(()=>new V.PerceptionEpisode({...episodeInput('bad','BLINK',100),humanAnnotation:'BAD'}),'BAD_ANNOTATION');throws(()=>new V.PerceptionEpisode({...episodeInput('bad','BLINK',100),landmarks:[]}),'LANDMARK_REJECT');throws(()=>new V.PerceptionEpisode({...episodeInput('bad','BLINK',100),measuredValues:{ear:NaN}}),'EPISODE_NAN');
const runtime=new V.ValidationRuntime({now:()=>now}),validator=new DriverPerception.PerceptionEpisodeValidator.PerceptionEpisodeValidator({runtime,now:()=>now});let state=runtime.start({validationSessionId:'validation-live',canonicalTargetId:target,assignmentId:assignment,vehicleType:'FORKLIFT',cameraPosition:'DRIVER_FRONT',lightingCondition:'NORMAL',glassesMode:'UNKNOWN'});check(state.session.state==='RECORDING','SESSION_START');check(state.audit[0].eventType==='VALIDATION_SESSION_STARTED','START_AUDIT');throws(()=>runtime.start({validationSessionId:'again',canonicalTargetId:target,assignmentId:assignment}),'DOUBLE_START_REJECT');state=runtime.pause();check(state.session.state==='PAUSED','SESSION_PAUSE');check(runtime.recordSnapshot({snapshotId:'paused',timestamp:at(0),metrics:{},quality:{},faceDetected:true})===null,'PAUSED_NO_SAMPLE');state=runtime.resume();check(state.session.state==='RECORDING','SESSION_RESUME');throws(()=>runtime.resume(),'INVALID_RESUME');
const snapshot=(id,overrides={})=>({driverMetricSnapshotId:id,timestamp:at(200),canonicalTargetId:target,assignmentId:assignment,faceDetected:true,metrics:{ear:.22,marSmoothed:.3,blinkCount:1,yawnCount:0,headPoseState:'CENTER'},diagnostics:{eye:{blinkAccepted:true},mouth:{marValid:true}},quality:{landmarkAvailable:true,earValid:true,marValid:true,headPoseValid:true},attention:{attentionState:'ATTENTIVE'},confidence:{runtimeConfidenceScore:82,runtimeConfidenceBand:'HIGH'},...overrides});check(runtime.recordSnapshot(snapshot('snapshot-1')).snapshotId==='snapshot-1','SNAPSHOT_RECORDED');check(runtime.getState().session.validSamples===1,'VALID_SAMPLE');runtime.recordSnapshot(snapshot('snapshot-invalid',{faceDetected:false,quality:{landmarkAvailable:false}}));check(runtime.getState().session.invalidSamples===1,'INVALID_SAMPLE');throws(()=>runtime.recordSnapshot(snapshot('wrong-target',{canonicalTargetId:'OTHER'})),'TARGET_ISOLATION');throws(()=>runtime.recordSnapshot(snapshot('wrong-assignment',{assignmentId:'OTHER'})),'ASSIGNMENT_ISOLATION');throws(()=>runtime.recordSnapshot({...snapshot('frame'),frame:{}}),'SNAPSHOT_FRAME_REJECT');const generation=runtime.generation;runtime.reset();runtime.start({validationSessionId:'validation-main',canonicalTargetId:target,assignmentId:assignment});check(runtime.recordSnapshot(snapshot('stale'),{generation})===null,'STALE_GENERATION');
const blink=(id,duration,extra={})=>validator.addBlink({...episodeInput(id,'BLINK',duration,{leftEar:.1,rightEar:.1,rawEar:.1,smoothedEar:.12,closureDurationMs:duration,recoveryDurationMs:100,frameCount:4,validFrameCount:4,invalidFrameCount:0,oneEyeOnly:false,frameGapMs:33,faceDetected:true,earValid:true,headPoseState:'CENTER',recoveryConfirmed:true,...extra},{threshold:.2,blinkMinMs:80,blinkMaxMs:500,recoveryMs:80,maxFrameGapMs:250})});const validBlink=blink('blink-valid',150);check(validBlink.decision==='ACCEPTED','BLINK_ACCEPT');check(validBlink.acceptReasonCodes.includes('BLINK_DURATION_VALID'),'BLINK_DURATION_REASON');check(validBlink.acceptReasonCodes.includes('BOTH_EYES_VALID'),'BLINK_BOTH_EYES');check(validBlink.acceptReasonCodes.includes('EAR_THRESHOLD_CROSSED'),'BLINK_EAR_CROSS');check(validBlink.acceptReasonCodes.includes('RECOVERY_CONFIRMED'),'BLINK_RECOVERY');check(blink('blink-short',40).rejectReasonCodes.includes('BLINK_TOO_SHORT'),'BLINK_SHORT');const longBlink=blink('blink-long',700);check(longBlink.episodeType==='LONG_EYE_CLOSURE','LONG_CLOSURE_TYPE');check(longBlink.rejectReasonCodes.includes('BLINK_TOO_LONG'),'BLINK_LONG');check(blink('blink-one-eye',150,{oneEyeOnly:true}).rejectReasonCodes.includes('ONE_EYE_ONLY'),'BLINK_ONE_EYE');check(blink('blink-face',150,{faceDetected:false}).rejectReasonCodes.includes('FACE_LOST'),'BLINK_FACE_LOSS');check(blink('blink-gap',150,{frameGapMs:500}).rejectReasonCodes.includes('FRAME_GAP_TOO_LARGE'),'BLINK_FRAME_GAP');check(blink('blink-recovery',150,{recoveryConfirmed:false}).rejectReasonCodes.includes('RECOVERY_INCOMPLETE'),'BLINK_RECOVERY_INCOMPLETE');check(blink('blink-head',150,{headPoseState:'DOWN'}).rejectReasonCodes.includes('HEAD_POSE_DEGRADED'),'BLINK_HEAD_GATE');check(blink('blink-invalid',150,{invalidFrameCount:1}).decision==='REJECTED','BLINK_INVALID_FRAME');throws(()=>runtime.addEpisode(validBlink),'BLINK_DUPLICATE');runtime.annotate('blink-valid','TRUE_BLINK');check(runtime.getState().episodes.find(x=>x.episodeId==='blink-valid').humanAnnotation==='TRUE_BLINK','TRUE_BLINK_ANNOTATION');runtime.annotate('blink-short','FALSE_BLINK');check(runtime.summary().blink.humanFalseCount===1,'FALSE_BLINK_COUNT');
const yawn=(id,duration,extra={})=>validator.addYawn({...episodeInput(id,'YAWN',duration,{rawMar:.8,smoothedMar:.7,baselineMar:.3,activeThreshold:.6,candidateThreshold:.58,mouthOpenDurationMs:duration,sustainDurationMs:duration,recoveryDurationMs:200,headPoseState:'CENTER',headPoseGateResult:true,faceDetected:true,landmarkValid:true,marValid:true,calibrationAvailable:true,recoveryConfirmed:true,algorithmYawnState:'RECOVERED',yawnCountBefore:0,yawnCountAfter:1,...extra},{activeThreshold:.6,candidateThreshold:.58,sustainMs:1200,recoveryMs:150,maxDurationMs:8000})});const validYawn=yawn('yawn-valid',1800);check(validYawn.decision==='ACCEPTED','YAWN_ACCEPT');check(validYawn.acceptReasonCodes.includes('MAR_THRESHOLD_CROSSED'),'YAWN_MAR_REASON');check(validYawn.acceptReasonCodes.includes('YAWN_SUSTAIN_CONFIRMED'),'YAWN_SUSTAIN');check(validYawn.acceptReasonCodes.includes('CLOSE_RECOVERY_CONFIRMED'),'YAWN_RECOVERY');check(validYawn.acceptReasonCodes.includes('EPISODE_COUNTED_ONCE'),'YAWN_COUNT_ONCE');check(yawn('yawn-short',500).rejectReasonCodes.includes('MOUTH_OPEN_TOO_SHORT'),'YAWN_SHORT');check(yawn('yawn-long',9000).rejectReasonCodes.includes('MOUTH_OPEN_TOO_LONG'),'YAWN_LONG');check(yawn('yawn-recovery',1800,{recoveryConfirmed:false}).rejectReasonCodes.includes('RECOVERY_INCOMPLETE'),'YAWN_RECOVERY_INCOMPLETE');check(yawn('yawn-pose',1800,{headPoseGateResult:false}).rejectReasonCodes.includes('HEAD_POSE_OUT_OF_RANGE'),'YAWN_HEAD_GATE');check(yawn('yawn-mar',1800,{marValid:false}).rejectReasonCodes.includes('MAR_INVALID'),'YAWN_MAR_INVALID');check(yawn('yawn-cal',1800,{calibrationAvailable:false}).rejectReasonCodes.includes('CALIBRATION_UNAVAILABLE'),'YAWN_CALIBRATION');check(yawn('yawn-dup-count',1800,{yawnCountAfter:2}).rejectReasonCodes.includes('DUPLICATE_EPISODE'),'YAWN_DUP_COUNT');const talking=yawn('yawn-talking',1800,{humanAnnotation:'TALKING'});check(talking.rejectReasonCodes.includes('TALKING_CANDIDATE'),'TALKING_CANDIDATE');const smile=yawn('yawn-smile',1800,{humanAnnotation:'SMILE'});check(smile.rejectReasonCodes.includes('SMILE_CANDIDATE'),'SMILE_CANDIDATE');runtime.annotate('yawn-valid','TRUE_YAWN');runtime.annotate('yawn-talking','TALKING');runtime.annotate('yawn-smile','SMILE');check(runtime.summary().yawn.trueYawn===1,'TRUE_YAWN_COUNT');check(runtime.summary().yawn.talking===1,'TALKING_COUNT');check(runtime.summary().yawn.smile===1,'SMILE_COUNT');check(runtime.summary().yawn.countIncrements>=1,'YAWN_INCREMENT_SUMMARY');
const pose=(id,heuristic,expected,extra={})=>validator.addHeadPose({...episodeInput(id,'HEAD_POSE',100,{pitch:0,yaw:0,roll:0,heuristicState:heuristic,expectedAnnotation:expected,faceDetected:true,landmarkValid:true,metricValidity:true,eyeGateResult:true,mouthGateResult:true,...extra},{centerBoundary:5,downBoundary:10,upBoundary:-10,yawBoundary:15})});check(pose('pose-center','CENTER','CENTER').decision==='ACCEPTED','POSE_CENTER');check(pose('pose-down','DOWN','DOWN').decision==='ACCEPTED','POSE_DOWN');check(pose('pose-left','LEFT','LEFT').decision==='ACCEPTED','POSE_LEFT');check(pose('pose-right','RIGHT','RIGHT').decision==='ACCEPTED','POSE_RIGHT');check(pose('pose-disagree','LEFT','RIGHT').rejectReasonCodes.includes('HEAD_POSE_DISAGREEMENT'),'POSE_DISAGREE');check(pose('pose-unknown','UNKNOWN','CENTER').rejectReasonCodes.includes('HEAD_POSE_UNKNOWN'),'POSE_UNKNOWN');pose('pose-eye-gate','CENTER','CENTER',{eyeGateResult:false});pose('pose-mouth-gate','CENTER','CENTER',{mouthGateResult:false});check(runtime.summary().headPose.gateRejections===2,'POSE_GATE_SUMMARY');
const attention=validator.addAttention({...episodeInput('attention-loss','ATTENTION_LOSS',1600,{gazeDirection:'DOWN',gazeSource:'HEAD_POSE',headDirection:'DOWN',attentionZone:'DOWN_OFF_ROAD',glanceDurationMs:1600,offRoadDurationMs:1600,attentionState:'DISTRACTED',quality:{valid:true},faceDetected:true},{entrySustainMs:1500})});check(attention.decision==='ACCEPTED','ATTENTION_ACCEPT');check(attention.acceptReasonCodes.includes('ATTENTION_STATE_OBSERVED'),'ATTENTION_REASON');check(validator.addAttention({...episodeInput('attention-normal','ATTENTION_LOSS',100,{attentionState:'ATTENTIVE',quality:{valid:true},faceDetected:true})}).decision==='REJECTED','ATTENTION_NORMAL_REJECT');
const confidence=validator.confidenceRecord({overallConfidence:82,confidenceBand:'HIGH',measurementConfidence:80,sensorHealthConfidence:90,identityConfidence:100,freshnessConfidence:95,contextCompletenessConfidence:70,agreementConfidence:75,reasonCodes:['MEASUREMENT_VALID']});check(confidence.runtimeConfidenceScore===82,'CONFIDENCE_SCORE');check(confidence.runtimeConfidenceBand==='HIGH','CONFIDENCE_BAND');check(confidence.measurementConfidence===80,'CONFIDENCE_MEASUREMENT');check(confidence.sensorHealthConfidence===90,'CONFIDENCE_SENSOR');check(confidence.identityConfidence===100,'CONFIDENCE_IDENTITY');check(confidence.freshnessConfidence===95,'CONFIDENCE_FRESHNESS');check(confidence.contextCompletenessConfidence===70,'CONFIDENCE_CONTEXT');check(confidence.agreementConfidence===75,'CONFIDENCE_AGREEMENT');check(confidence.reasonCodes[0]==='MEASUREMENT_VALID','CONFIDENCE_REASONS');
const comparator=new DriverPerception.PerceptionThresholdComparator.PerceptionThresholdComparator({minimumEvidence:5});const dist=comparator.distribution([.1,.2,.2,.3,null]);check(dist.count===4,'DIST_COUNT');check(dist.median===.2,'DIST_MEDIAN');check(Math.abs(dist.mad-.05)<1e-12,'DIST_MAD');check(dist.missingRatio===.2,'DIST_MISSING');const insufficient=comparator.compare({metricGroup:'BLINK',metricName:'EAR_THRESHOLD',currentValue:.2,candidateValue:.18,evidence:[.1,.2],annotations:[]});check(insufficient.recommendationState==='INSUFFICIENT_DATA','COMPARISON_INSUFFICIENT');check(insufficient.automaticallyApplied===false,'NO_AUTO_APPLY');const lower=comparator.compare({metricGroup:'BLINK',metricName:'EAR_THRESHOLD',currentValue:.2,candidateValue:.18,evidence:[.1,.15,.18,.2,.22],annotations:['TRUE','TRUE']});check(lower.recommendationState==='REVIEW_LOWER','REVIEW_LOWER');check(lower.difference===-.020000000000000018,'LOWER_DIFFERENCE');const higher=comparator.compare({metricGroup:'YAWN',metricName:'MAR_THRESHOLD',currentValue:.6,candidateValue:.65,evidence:[.5,.6,.7,.8,.9],annotations:['TRUE']});check(higher.recommendationState==='REVIEW_HIGHER','REVIEW_HIGHER');const keep=comparator.compare({metricGroup:'CONFIDENCE',metricName:'HIGH',currentValue:80,candidateValue:80,evidence:[70,75,80,85,90],annotations:['TRUE']});check(keep.recommendationState==='KEEP_CURRENT_CANDIDATE','KEEP_CURRENT');const rejected=comparator.compare({metricGroup:'BLINK',metricName:'EAR',currentValue:.2,candidateValue:.1,evidence:[1,2,3,4,5],annotations:['TRUE'],profile:'UNSUPPORTED'});check(rejected.recommendationState==='REJECT_CANDIDATE','UNSUPPORTED_PROFILE');const infinityComparison=comparator.compare({metricGroup:'X',metricName:'INFINITY',currentValue:1,candidateValue:Infinity,evidence:[],annotations:[]}),nanComparison=comparator.compare({metricGroup:'X',metricName:'NAN',currentValue:1,candidateValue:NaN,evidence:[],annotations:[]}),undefinedComparison=comparator.compare({metricGroup:'X',metricName:'UNDEFINED',currentValue:1,candidateValue:undefined,evidence:[],annotations:[]});check(infinityComparison.candidateValue===null&&infinityComparison.difference===null,'COMPARATOR_INFINITY_NULL');check(nanComparison.candidateValue===null&&nanComparison.difference===null,'COMPARATOR_NAN_NULL');check(undefinedComparison.candidateValue===null&&undefinedComparison.difference===null,'COMPARATOR_UNDEFINED_NULL');check([infinityComparison,nanComparison,undefinedComparison].every(x=>x.recommendationState==='INSUFFICIENT_DATA'&&x.estimatedImpact==='UNKNOWN'),'INVALID_CANDIDATE_INSUFFICIENT');runtime.addComparison(lower);runtime.addComparison(higher);runtime.addComparison(keep);check(runtime.getState().comparisons.length===3,'COMPARISON_ADDED');check(runtime.getState().audit.some(x=>x.eventType==='THRESHOLD_COMPARISON_CREATED'),'COMPARISON_AUDIT');
const csv=runtime.exportCSV(),json=JSON.parse(runtime.exportJSON());check(csv.startsWith('\uFEFF'),'CSV_BOM');check(csv.includes('validationSessionId'),'CSV_HEADER');check(json.privacy.containsImages===false,'EXPORT_NO_IMAGES');check(json.privacy.containsFrames===false,'EXPORT_NO_FRAMES');check(json.privacy.containsLandmarks===false,'EXPORT_NO_LANDMARKS');check(json.operationalUseAllowed===false,'EXPORT_OPERATIONAL_FALSE');check(json.replayArtifacts.some(x=>x.eventType==='EPISODE_ACCEPTED'),'REPLAY_ACCEPTED');check(json.replayArtifacts.some(x=>x.eventType==='HUMAN_ANNOTATION_ADDED'),'REPLAY_ANNOTATION');check(!json.replayArtifacts.some(x=>x.eventType==='VALIDATION_SESSION_PAUSED'),'REPLAY_ALLOWLIST');now+=10000;state=runtime.complete();check(state.session.state==='COMPLETED','SESSION_COMPLETE');check(state.session.validationState==='FIELD_CANDIDATE','FIELD_CANDIDATE');check(state.session.durationMs===10000,'SESSION_DURATION');throws(()=>runtime.pause(),'PAUSE_AFTER_COMPLETE');const emptyRuntime=new V.ValidationRuntime({now:()=>now});emptyRuntime.start({validationSessionId:'empty',canonicalTargetId:target,assignmentId:assignment});const emptyComparator=comparator.compare({metricGroup:'BLINK',metricName:'EAR_THRESHOLD',currentValue:undefined,candidateValue:undefined,evidence:[],annotations:[]});emptyRuntime.addComparison(emptyComparator);const emptyState=emptyRuntime.complete(),emptySummary=emptyState.summary,emptyJson=JSON.parse(emptyRuntime.exportJSON()),emptyCsv=emptyRuntime.exportCSV();check(emptyState.session.state==='COMPLETED','EMPTY_SESSION_COMPLETED');check(emptyState.session.state!=='RECORDING','EMPTY_SESSION_NOT_RECORDING');check(emptySummary.status==='INSUFFICIENT_DATA','EMPTY_SUMMARY_INSUFFICIENT');check(emptySummary.sampleCount===0&&emptySummary.validSamples===0&&emptySummary.episodeCount===0,'EMPTY_SUMMARY_COUNTS');check(emptySummary.thresholdComparison==='INSUFFICIENT_DATA','EMPTY_THRESHOLD_INSUFFICIENT');check(emptyJson.comparisons[0].candidateValue===null,'EMPTY_JSON_CANDIDATE_NULL');check(!/NaN|Infinity|undefined/.test(emptyRuntime.exportJSON()),'EMPTY_JSON_SAFE');check(emptyCsv.startsWith('\uFEFFvalidationSessionId,')&&emptyCsv.trim().split(/\r?\n/).length===1,'EMPTY_CSV_HEADER_ONLY');const cancelRuntime=new V.ValidationRuntime({now:()=>now});cancelRuntime.start({validationSessionId:'cancel',canonicalTargetId:target,assignmentId:assignment});check(cancelRuntime.cancel().session.state==='CANCELLED','SESSION_CANCEL');check(cancelRuntime.getState().session.validationState==='REJECTED','CANCEL_REJECTED');cancelRuntime.reset();check(cancelRuntime.getState().session===null,'SESSION_RESET');
const source=[V.ValidationRuntime,DriverPerception.PerceptionEpisodeValidator.PerceptionEpisodeValidator,DriverPerception.PerceptionThresholdComparator.PerceptionThresholdComparator].join(' ');check(!/fetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon/.test(source),'NO_NETWORK');check(!/localStorage|sessionStorage|indexedDB|FileReader/.test(source),'NO_BROWSER_STORAGE');check(!/getUserMedia|MediaRecorder|ImageData/.test(source),'NO_MEDIA_ACCESS');check(!/applyThreshold|activateProfile|setRuntimeThreshold/.test(source),'NO_THRESHOLD_APPLICATION');check(pass.length>=100,'MINIMUM_100_ASSERTIONS');document.getElementById('result').textContent=[...pass.map(x=>'PASS '+x),...fail.map(x=>'FAIL '+x)].join('\n');document.title=fail.length?`FAIL - Perception Validation (${fail.length})`:`PASS - Perception Validation (${pass.length})`})();</script></body></html>
