<!doctype html><html><head><meta charset="utf-8"><title>RUNNING - Bounded Adaptive Calibration</title></head><body><pre id="result"></pre>
<script>window.addEventListener('error',event=>{document.title='FAIL - Bounded Adaptive Calibration';document.getElementById('result').textContent=event.error?.stack||event.message})</script>
<script src="../backend/static/js/driver_perception/driver_perception_config.js"></script><script src="../backend/static/js/driver_perception/driver_calibration.js"></script><script src="../backend/static/js/driver_perception/guided_live_tuning.js"></script><script src="../backend/static/js/web_demo_warning.js"></script>
<script>(()=>{'use strict';const passed=[],check=(value,name)=>{if(!value)throw Error(name);passed.push(name)},C=DriverPerception.Config,config={...C.calibration,minimumCollectionMs:3000,maximumCollectionMs:10000,rollingEvaluationWindowMs:3000,passingConfirmationMs:500,minimumPassingEvaluations:3};
const create=()=>{const runtime=new DriverPerception.DriverCalibration(config),start=runtime.start(0,{runtimeGeneration:1});return{runtime,start}},add=(pair,t,left=.27,right=.12,valid=true)=>pair.runtime.addSample((left+right)/2,{valid,leftEAR:left,rightEAR:right,pitch:10,yaw:0,roll:0,mar:.1,marValid:true,timestamp:t,expectedCalibrationSessionId:pair.start.calibrationSessionId,expectedCalibrationGeneration:pair.start.calibrationGeneration}),stable=(pair,from,to,step=250)=>{let state;for(let t=from;t<=to;t+=step)state=add(pair,t);return state};
let pair=create(),state=stable(pair,0,2750);check(state.state==='COLLECTING','NO_COMPLETION_BEFORE_3000');state=stable(pair,3000,3500);check(state.state==='READY'&&state.completedAt===undefined,'READY_AFTER_PERSISTENT_PASS');check(state.elapsedMs===3500,'READY_AT_3500');check(state.completionDiagnostics.allCompletionGatesPassed,'READY_ALL_GATES_SIMULTANEOUS');check(state.completionDiagnostics.selectedAcceptedInterval.sampleCount>=8,'COHERENT_INTERVAL_SELECTED');
pair=create();for(let t=0,i=0;t<=3000;t+=250,i++)add(pair,t,[.18,.24,.30][i%3],.12);state=pair.runtime.getState(3000);check(state.state==='COLLECTING'&&state.completionDiagnostics.persistentBlockers.includes('leftStabilityAcceptable'),'LEFT_UNSTABLE_EXTENDS_AFTER_3000');state=stable(pair,3250,8000);check(state.state==='READY'&&state.elapsedMs<10000,'LATER_SIMULTANEOUS_STABILITY_READY');
pair=create();stable(pair,0,3000);add(pair,3250,.27,.12,false);add(pair,3500);add(pair,3750);add(pair,4000,.27,.12,false);state=pair.runtime.getState(4000);check(state.state==='COLLECTING','OSCILLATION_NOT_PREMATURE_READY');check(state.completionDiagnostics.consecutivePassingEvaluations===0,'OSCILLATION_RESETS_CONFIRMATION');
const timeout=(leftValues,rightValues)=>{const p=create();let i=0,s;for(let t=0;t<=10000;t+=250,i++)s=add(p,t,leftValues[i%leftValues.length],rightValues[i%rightValues.length]);return s};
state=timeout([.18,.24,.30],[.12]);check(state.state==='INVALID','LEFT_FAILURE_TIMEOUT_INVALID');check(state.completionDiagnostics.timeoutReason==='MAXIMUM_COLLECTION_DURATION_REACHED','LEFT_TIMEOUT_REASON');check(state.completionDiagnostics.persistentBlockers.includes('leftStabilityAcceptable'),'LEFT_TIMEOUT_BLOCKER');check(state.eyeCalibrationReasonCodes.includes('LEFT_EYE_STABILITY_UNACCEPTABLE'),'LEFT_EXACT_REASON');
state=timeout([.27],[.08,.11,.14]);check(state.state==='INVALID'&&state.completionDiagnostics.persistentBlockers.includes('rightStabilityAcceptable'),'RIGHT_FAILURE_TIMEOUT_BLOCKER');check(state.eyeCalibrationReasonCodes.includes('RIGHT_EYE_STABILITY_UNACCEPTABLE'),'RIGHT_EXACT_REASON');
state=timeout([.18,.24,.30],[.08,.11,.14]);check(state.state==='INVALID','BOTH_FAILURE_TIMEOUT_INVALID');check(state.completionDiagnostics.persistentBlockers.includes('leftStabilityAcceptable')&&state.completionDiagnostics.persistentBlockers.includes('rightStabilityAcceptable'),'BOTH_EYE_BLOCKERS');
check(state.completionDiagnostics.quality.maximumStabilityRatio===.15,'STABILITY_LIMIT_UNCHANGED');check(state.completionDiagnostics.counts.requiredPerEye===C.calibration.minimumSamples&&C.calibration.minimumSamples===8,'MINIMUM_SAMPLES_UNCHANGED');check(C.calibration.minimumCollectionMs===3000&&C.calibration.maximumCollectionMs===10000,'PRODUCTION_BOUNDS');
pair=create();stable(pair,0,3500);const ready=pair.runtime.getState(3500),before=ready.sampleCount;pair.runtime.addSample(.2,{leftEAR:.27,rightEAR:.12,pitch:10,yaw:0,roll:0,timestamp:3600,expectedCalibrationSessionId:'STALE',expectedCalibrationGeneration:pair.start.calibrationGeneration});state=pair.runtime.getState(3600);check(state.state==='READY'&&state.sampleCount===before&&state.lastRejectReason==='CALIBRATION_SESSION_MISMATCH','STALE_CALLBACK_ISOLATED');
const guided=new DriverPerception.GuidedLiveTuningSession({now:()=>4000});guided.start(4000,ready);guided.ingest({timestamp:new Date(4000).toISOString(),faceDetected:true,calibrated:true,calibrationState:'READY',calibrationSessionId:ready.calibrationSessionId,calibrationGeneration:ready.calibrationGeneration,runtimeGeneration:ready.runtimeGeneration,metrics:{blinkCount:0},quality:{landmarkAvailable:true,earValid:true,marValid:true},diagnostics:{eye:{armed:true},mouth:{}}});check(guided.state().complete&&guided.state().auditHistory.some(x=>x.eventType==='GUIDED_SYNCHRONIZED_TO_AUTHORITATIVE_READY'),'GUIDED_SYNCHRONIZES_READY');
const audio={getState:()=>({enabled:true,unlocked:true,playbackState:'IDLE'})},demo=new WebDemoWarning.WebDemoWarningRuntime({audioAdapter:audio,isVisible:()=>true,isFocused:()=>true});demo.enable();demo.armEye();check(ready.state==='READY'&&demo.getState().eye.armed,'WEB_DEMO_CAN_PROCEED_AFTER_READY');
check(C.metrics.blinkRearm.closeEntryRatio===.55&&C.metrics.blinkRearm.openRecoveryRatio===.65,'BLINK_THRESHOLDS_UNCHANGED');check(C.yawn.mouthOpenThresholdRatio===1.8&&C.yawn.mouthOpenThresholdOffset===.08,'YAWN_THRESHOLDS_UNCHANGED');
document.title=`PASS - Bounded Adaptive Calibration (${passed.length})`;result.textContent=passed.join('\n')})()</script></body></html>
