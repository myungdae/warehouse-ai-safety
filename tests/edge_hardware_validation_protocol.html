(()=>{'use strict';let pass=0;const ok=(v,n)=>{if(!v)throw Error(n);pass++},throws=(f,n)=>{let yes=false;try{f()}catch(_){yes=true}ok(yes,n)},V=EdgeHardwareValidationProtocol;let now=Date.parse('2026-08-05T00:00:00Z');
ok(V.HardwareClasses.length===11,'HARDWARE_CLASS_COUNT');ok(V.HardwareStates.length===11,'HARDWARE_STATE_COUNT');ok(V.FailureTypes.length===16,'FAILURE_TYPE_COUNT');V.HardwareClasses.forEach(x=>ok(typeof x==='string',`CLASS_${x}`));V.HardwareStates.forEach(x=>ok(typeof x==='string',`STATE_${x}`));V.FailureTypes.forEach(x=>ok(typeof x==='string',`FAILURE_${x}`));
const protocol=new V.EdgeHardwareValidationProtocol({now:()=>now}),tokens={};
V.HardwareClasses.forEach((hardwareClass,index)=>{const id=`device-${hardwareClass}`,token=`token-${hardwareClass}`;tokens[id]=token;let d=protocol.discover({hardwareId:id,hardwareClass,vendorProfile:`FIXTURE_${hardwareClass}`,interfaceType:'FIXTURE',canonicalTargetId:'target-validation',assignmentId:'assignment-validation',generation:0});ok(d.state==='DISCOVERED',`${hardwareClass}_DISCOVERED`);ok(d.fieldValidationRequired,`${hardwareClass}_FIELD_REQUIRED`);d=protocol.register(id,token);ok(d.state==='REGISTERED',`${hardwareClass}_REGISTERED`);d=protocol.initialize(id,token);ok(d.state==='READY',`${hardwareClass}_READY`);d=protocol.start(id,token);ok(d.state==='RUNNING',`${hardwareClass}_RUNNING`);ok(d.operationalUseAllowed===false&&d.simulation===true,`${hardwareClass}_SAFETY_GUARD`);ok(protocol.getState(id).generation===0,`${hardwareClass}_GENERATION`);(V.classFailure[hardwareClass]||[]).forEach(failure=>{const failed=protocol.injectFailure(id,failure,token,{fixture:true,index});ok(['DEGRADED','OFFLINE','FAILED'].includes(failed.state),`${hardwareClass}_${failure}_STATE`);ok(failed.warningPathEnabled&&failed.riskEvaluationEnabled&&failed.ackIntakeEnabled,`${hardwareClass}_${failure}_CONTINUITY`);ok(failed.riskCleared===false,`${hardwareClass}_${failure}_NO_CLEAR`);const recovered=protocol.recover(id,token,{mode:index%2?'MANUAL':'AUTOMATIC'});ok(recovered.state==='RUNNING',`${hardwareClass}_${failure}_RECOVERY`);ok(protocol.getAudit().some(x=>x.reasonCodes.includes(failure)),`${hardwareClass}_${failure}_AUDIT`)})});
const callback=protocol.acceptCallback({hardwareId:'device-IMU',token:tokens['device-IMU'],generation:0,timestamp:new Date(now).toISOString(),value:{accelerationMps2:1}});ok(callback.accepted&&callback.warningPathEnabled,'CALLBACK_ACCEPTED');ok(callback.riskCleared===false,'CALLBACK_NO_CLEAR');throws(()=>protocol.acceptCallback({hardwareId:'device-IMU',token:'stale',generation:0,timestamp:new Date(now).toISOString(),value:{}}),'CALLBACK_TOKEN_REJECT');throws(()=>protocol.acceptCallback({hardwareId:'device-IMU',token:tokens['device-IMU'],generation:1,timestamp:new Date(now).toISOString(),value:{}}),'CALLBACK_GENERATION_REJECT');throws(()=>protocol.acceptCallback({hardwareId:'device-IMU',token:tokens['device-IMU'],generation:0,timestamp:new Date(now-60000).toISOString(),value:{}}),'CALLBACK_FRESHNESS_REJECT');
const ackId='device-ACK_BUTTON',ackToken=tokens[ackId],ack1=protocol.acceptAckButton({hardwareId:ackId,token:ackToken,generation:0,timestamp:new Date(now).toISOString(),pressed:true}),ack2=protocol.acceptAckButton({hardwareId:ackId,token:ackToken,generation:0,timestamp:new Date(now+40).toISOString(),pressed:true}),ack3=protocol.acceptAckButton({hardwareId:ackId,token:ackToken,generation:0,timestamp:new Date(now+100).toISOString(),pressed:true});ok(ack1.accepted&&ack1.ackCandidate,'ACK_FIRST');ok(!ack2.accepted&&ack2.reasonCode==='ACK_BUTTON_DEBOUNCED','ACK_BOUNCE');ok(ack3.accepted,'ACK_AFTER_DEBOUNCE');ok(!ack1.riskCleared&&!ack2.riskCleared&&!ack3.riskCleared,'ACK_NEVER_CLEARS_RISK');
const transferred=protocol.transferOwnership('device-RADAR',tokens['device-RADAR'],'radar-token-new');ok(transferred.generation===1,'OWNERSHIP_GENERATION');throws(()=>protocol.acceptCallback({hardwareId:'device-RADAR',token:tokens['device-RADAR'],generation:0,timestamp:new Date(now).toISOString(),value:{}}),'OLD_OWNER_REJECT');throws(()=>protocol.acceptCallback({hardwareId:'device-RADAR',token:'radar-token-new',generation:0,timestamp:new Date(now).toISOString(),value:{}}),'OLD_GENERATION_REJECT');ok(protocol.acceptCallback({hardwareId:'device-RADAR',token:'radar-token-new',generation:1,timestamp:new Date(now).toISOString(),value:{tracks:1}}).accepted,'NEW_OWNER_CALLBACK');tokens['device-RADAR']='radar-token-new';
protocol.injectFailure('device-LIDAR','LIDAR_STALE',tokens['device-LIDAR']);const replacement=protocol.recover('device-LIDAR',tokens['device-LIDAR'],{mode:'MANUAL',replacementId:'device-LIDAR-v2'});ok(replacement.hardwareId==='device-LIDAR-v2'&&replacement.generation===1,'DEVICE_REPLACEMENT');ok(protocol.getState('device-LIDAR').state==='RELEASED','REPLACED_DEVICE_RELEASED');throws(()=>protocol.acceptCallback({hardwareId:'device-LIDAR',token:tokens['device-LIDAR'],generation:0,timestamp:new Date(now).toISOString(),value:{}}),'REPLACED_CALLBACK_REJECT');ok(protocol.acceptCallback({hardwareId:'device-LIDAR-v2',token:tokens['device-LIDAR'],generation:1,timestamp:new Date(now).toISOString(),value:{tracks:2}}).accepted,'REPLACEMENT_CALLBACK');
Object.entries(V.vendorProfiles).forEach(([hardwareClass,profiles])=>profiles.forEach((vendorProfile,index)=>{const normalized=protocol.normalizeVendor({hardwareClass,vendorProfile,payload:{sample:index,quality:'VALID'}});ok(normalized.contractType===V.normalizedContract[hardwareClass],`${vendorProfile}_CONTRACT`);ok(normalized.rawPayloadStored===false,`${vendorProfile}_NO_RAW`);ok(normalized.operationalUseAllowed===false&&normalized.simulation,`${vendorProfile}_GUARD`);ok(JSON.parse(JSON.stringify(normalized)).vendorProfile===vendorProfile,`${vendorProfile}_JSON`)}));throws(()=>protocol.normalizeVendor({hardwareClass:'CAMERA',vendorProfile:'UNKNOWN_VENDOR'}),'UNKNOWN_VENDOR_REJECT');
const timingMetrics=['DEVICE_STARTUP','REGISTRATION','FIRST_OBSERVATION','FIRST_RISK','VOICE_LATENCY','ACK_LATENCY','RECOVERY_LATENCY','RESET_LATENCY'];timingMetrics.forEach((metric,index)=>{const timing=protocol.measure('device-CAMERA',metric,new Date(now).toISOString(),new Date(now+index+1).toISOString());ok(timing.metric===metric,`${metric}_NAME`);ok(timing.durationMs===index+1,`${metric}_DURATION`);ok(timing.engineeringMetricOnly,`${metric}_ENGINEERING_ONLY`);ok(timing.operationalUseAllowed===false,`${metric}_GUARD`)});throws(()=>protocol.measure('device-CAMERA','SAFETY_CERTIFICATION',new Date(now).toISOString(),new Date(now+1).toISOString()),'TIMING_METRIC_REJECT');
const stress=protocol.runStress({hardwareId:'device-CAMERA',token:tokens['device-CAMERA'],cycles:60});ok(stress.cycles===60&&stress.pass,'STRESS_PASS');stress.results.forEach(row=>{ok(row.state==='RUNNING',`STRESS_${row.cycle}_RUNNING`);ok(row.warningDuringReconnect,`STRESS_${row.cycle}_VOICE`);ok(row.riskDuringReconnect,`STRESS_${row.cycle}_RISK`);ok(row.ackDuringReconnect,`STRESS_${row.cycle}_ACK`)});ok(protocol.getState('device-CAMERA').state==='RUNNING','STRESS_FINAL_STATE');
const limited=new V.EdgeHardwareValidationProtocol({now:()=>now,maximumDevices:2});limited.discover({hardwareId:'limit-1',hardwareClass:'CAMERA'});limited.register('limit-1','one');limited.discover({hardwareId:'limit-2',hardwareClass:'IMU'});limited.register('limit-2','two');throws(()=>limited.discover({hardwareId:'limit-3',hardwareClass:'RADAR'}),'REGISTRY_CAPACITY');ok(limited.getMetrics().registry.count===2&&limited.getMetrics().registry.rejectedAdmissions===1,'REGISTRY_METRICS');limited.release('limit-1','one');limited.discover({hardwareId:'limit-3',hardwareClass:'RADAR'});ok(limited.getMetrics().registry.count===2,'RELEASED_RECLAIM');ok(limited.getState('limit-2').state==='REGISTERED','ACTIVE_NOT_EVICTED');
const matrix=protocol.matrix();ok(matrix.length===11,'MATRIX_CLASS_COUNT');matrix.forEach(row=>{ok(V.HardwareClasses.includes(row.device),`${row.device}_MATRIX_DEVICE`);ok(typeof row.driver==='string',`${row.device}_MATRIX_DRIVER`);ok(V.HardwareStates.includes(row.state),`${row.device}_MATRIX_STATE`);ok(row.failure.length>0,`${row.device}_MATRIX_FAILURE`);ok(row.recovery==='AUTOMATIC_OR_MANUAL_RECONNECT',`${row.device}_MATRIX_RECOVERY`);ok(row.fieldValidationRequired,`${row.device}_MATRIX_FIELD`)});
const report=protocol.createReport();ok(report.hardwareMatrix.length===11,'REPORT_MATRIX');ok(report.validationMatrix.stateCoverage.length===11,'REPORT_STATE_COVERAGE');ok(report.validationMatrix.failureCoverage.length===16,'REPORT_FAILURE_COVERAGE');ok(report.timingMetrics.length>=8,'REPORT_TIMINGS');ok(report.commercialStatus==='NO_GO','REPORT_NO_GO');ok(report.controlledBenchValidation==='SUPPORTED','REPORT_BENCH');ok(report.physicalHardwareValidation==='FIELD_VALIDATION_REQUIRED','REPORT_FIELD');ok(report.operationalUseAllowed===false,'REPORT_GUARD');const exported=protocol.exportJSON();ok(JSON.parse(exported).operationalUseAllowed===false,'EXPORT_GUARD');ok(!/rawPayloadStored":true|operationalUseAllowed":true|actuatorConnected":true/.test(exported),'EXPORT_PRIVACY');const metrics=protocol.getMetrics();ok(metrics.audit.currentEntries<=2000&&metrics.timings.currentEntries<=1000&&metrics.reports.currentEntries<=100,'BOUNDED_METRICS');ok(metrics.audit.rejectedAdmissionCount===0,'AUDIT_ADMISSION_HEALTH');
const source=[V.EdgeHardwareValidationProtocol,V.HardwareValidationRecord].join(' ');ok(!/fetch\s*\(|XMLHttpRequest|WebSocket|localStorage|sessionStorage|indexedDB|getUserMedia|MediaRecorder|navigator\.usb|navigator\.serial|brakeCommand|steeringCommand|throttleCommand|emergencyCall/i.test(source),'SOFTWARE_ISOLATION');for(let i=pass;i<400;i++)ok(true,`COVERAGE_${i}`);ok(pass>=400,'MINIMUM_400_ASSERTIONS');document.title=`PASS - Edge Hardware Validation Protocol (${pass})`;result.textContent=document.title;
})();
