<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Runtime Safety Scenario Regression</title></head>
<body><pre id="results">RUNNING</pre>
<script src="../backend/static/js/sensor_observation.js"></script><script src="../backend/static/js/driver_state_config.js"></script>
<script src="../backend/static/js/driver_risk_runtime.js"></script><script src="../backend/static/js/runtime_event_graph.js"></script>
<script src="../backend/static/js/runtime_triple_engine.js"></script><script src="../backend/static/js/runtime_safety_scenarios.js"></script>
<script>(function(){'use strict';const output=document.getElementById('results');try{const key='regression-test-history';const history=new RuntimeSafetyScenarios.ScenarioHistory(key);history.clear();const results=new RuntimeSafetyScenarios.ScenarioRunner(history).runAll();const expected=['DROWSINESS','INCAPACITATION','ALCOHOL_LEVEL','HUMAN_PROXIMITY','TURN_RATE','HARD_ACCELERATION','HARD_BRAKING','DANGEROUS_TILT'];if(results.length!==8)throw new Error('Expected eight scenarios');expected.forEach((id,index)=>{const result=results[index];if(result.scenarioType!==id||result.status!=='PASS')throw new Error(`${id} failed`);if(result.lifecycle.map(item=>item.phase).join(',')!=='NORMAL,ENTRY,ACTIVE,ACK,CLEAR')throw new Error(`${id} lifecycle mismatch`);if(result.lifecycle.map(item=>item.riskState).join(',')!==',NEW,ACTIVE,ACKNOWLEDGED,CLEARED')throw new Error(`${id} risk state mismatch`);if(result.artifacts.runtimeGraph.nodes.length===0||result.artifacts.runtimeGraph.edges.length===0)throw new Error(`${id} has no runtime graph`);if(result.artifacts.runtimeTriples.length!==29)throw new Error(`${id} triple count is not 29`);if(!result.observations.every(item=>item.metadata.sensorConnected===false&&item.metadata.simulation===true&&item.metadata.operationalUseAllowed===false))throw new Error(`${id} operational guard mismatch`);});if(history.list().length!==8)throw new Error('History mismatch');const reloaded=new RuntimeSafetyScenarios.ScenarioHistory(key);if(reloaded.list().length!==8)throw new Error('LocalStorage reload mismatch');const unrelatedKey='regression-unrelated-history';localStorage.setItem(unrelatedKey,'["preserve"]');reloaded.clear();if(reloaded.list().length!==0||JSON.parse(localStorage.getItem(unrelatedKey))[0]!=='preserve')throw new Error('History clear scope mismatch');localStorage.removeItem(unrelatedKey);output.textContent=`PASS (${results.length} scenarios)\n${expected.join('\n')}`;document.title='PASS - Runtime Safety Scenario Regression';}catch(error){output.textContent=`FAIL\n${error.stack||error.message}`;document.title='FAIL - Runtime Safety Scenario Regression';throw error;}}());</script></body></html>
