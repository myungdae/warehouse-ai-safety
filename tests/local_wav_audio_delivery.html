<!doctype html><html><head><meta charset="utf-8"><title>RUNNING - Local WAV Audio Delivery</title></head><body><pre id="results"></pre>
<script src="../backend/static/js/voice_message_catalog.js"></script><script src="../backend/static/js/local_audio_asset_registry.js"></script><script src="../backend/static/js/audio_playback_adapter.js"></script>
<script>(async()=>{'use strict';const pass=[],check=(v,n)=>{if(!v)throw Error(n);pass.push(n)};const RegistryApi=window.LocalAudioAssetRegistry,{LocalAudioAssetRegistry,manifest,validPath}=RegistryApi;
const reg=new LocalAudioAssetRegistry();check(reg.getState().state==='NOT_INITIALIZED','REG_NOT_INITIALIZED');let state=await reg.initialize();check(state.state==='READY','REG_READY');check(state.availableCount===20,'REG_COUNT');check(reg.hasAsset('DROWSINESS_EARLY_WARNING'),'REG_HAS');check(!reg.hasAsset('MISSING'),'REG_MISSING');check(reg.getMissingMessageCodes(['DROWSINESS_EARLY_WARNING','MISSING'])[0]==='MISSING','REG_MISSING_CODES');const asset=reg.getAsset('DROWSINESS_EARLY_WARNING');check(asset.byteSize===28844,'META_SIZE');check(asset.sha256.length===64,'META_HASH');check(asset.sampleRateHz===16000&&asset.channels===1,'META_WAV');check(asset.reviewState==='DEVELOPMENT_CANDIDATE','META_REVIEW');check(asset.operationalUseAllowed===false,'META_GUARD');check(/^\/static\/audio\/voice\/ko-KR\//.test(asset.url),'LOCAL_URL');check(validPath(asset.relativePath),'ALLOWLIST');check(!validPath('https://bad/audio.wav'),'REJECT_HTTPS');check(!validPath('//bad/audio.wav'),'REJECT_PROTOCOL_RELATIVE');check(!validPath('data:audio/wav;base64,AA'),'REJECT_DATA');check(!validPath('blob:bad'),'REJECT_BLOB');check(!validPath('file:///bad.wav'),'REJECT_FILE');check(!validPath('audio/voice/ko-KR/../bad.wav'),'REJECT_TRAVERSAL');check(!validPath('other/bad.wav'),'REJECT_DIRECTORY');
let bad=new LocalAudioAssetRegistry({source:{schemaVersion:'2',assets:[]}});check((await bad.initialize()).reasonCodes.includes('MANIFEST_INVALID'),'INVALID_SCHEMA');bad=new LocalAudioAssetRegistry({source:null});check((await bad.initialize()).state==='ERROR','MISSING_MANIFEST');bad=new LocalAudioAssetRegistry({source:{schemaVersion:'1.0.0',assets:[{messageCode:'X',relativePath:'https://bad/x.wav',format:'wav'}]}});check((await bad.initialize()).reasonCodes.includes('EXTERNAL_URL_REJECTED'),'EXTERNAL_REASON');bad=new LocalAudioAssetRegistry({source:{schemaVersion:'1.0.0',assets:[{messageCode:'X',relativePath:'audio/voice/ko-KR/../x.wav',format:'wav'}]}});check((await bad.initialize()).reasonCodes.includes('PATH_NOT_ALLOWED'),'PATH_REASON');check(reg.reset().state==='NOT_INITIALIZED','REG_RESET');await reg.initialize();
class FakeAudio{constructor(url){this.url=url;this.listeners={};this.currentTime=0;this.volume=0}addEventListener(n,f){this.listeners[n]=f}removeEventListener(n){delete this.listeners[n]}play(){queueMicrotask(()=>{this.listeners.ended?.()});return Promise.resolve()}pause(){this.paused=true}}
class RejectAudio extends FakeAudio{play(){return Promise.reject(Error('blocked'))}}class ErrorAudio extends FakeAudio{play(){queueMicrotask(()=>this.listeners.error?.());return Promise.resolve()}}
class U{constructor(t){this.text=t}}const okSynth={getVoices:()=>[{name:'KO',lang:'ko-KR'}],speak:u=>queueMicrotask(()=>u.onend()),cancel(){this.cancelled=true}};const failSynth={getVoices:()=>[],speak:u=>queueMicrotask(()=>u.onerror({error:'synthesis-failed'})),cancel(){}};
let a=new AudioPlaybackAdapter.AudioPlaybackAdapter({registry:reg,Audio:FakeAudio,speechSynthesis:okSynth,Utterance:U,AudioContext:null});let out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'));check(out.deliveryState==='USER_GESTURE_REQUIRED','GESTURE_REQUIRED');await a.enable();out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'),{decisionId:'d1'});check(out.successfulMode==='LOCAL_WAV','WAV_SUCCESS');check(out.attemptedModes.length===1,'WAV_NO_TTS');check(out.decisionId==='d1','DECISION_ID');check(out.wavAssetPath===asset.relativePath,'WAV_PATH');check(a.history.some(x=>x.eventType==='LOCAL_WAV_REQUESTED'),'WAV_REQUESTED');check(a.history.some(x=>x.eventType==='LOCAL_WAV_STARTED'),'WAV_STARTED');check(out.deliveryState==='PLAYED','WAV_PLAYED');
a=new AudioPlaybackAdapter.AudioPlaybackAdapter({registry:reg,Audio:RejectAudio,speechSynthesis:okSynth,Utterance:U,AudioContext:null});await a.enable();out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'));check(out.successfulMode==='TTS','WAV_REJECT_TO_TTS');check(out.attemptedModes.join(',')==='LOCAL_WAV,TTS','FALLBACK_ORDER_1');check(out.reasonCodes.includes('WAV_PLAY_PROMISE_REJECTED'),'WAV_REJECT_REASON');
a=new AudioPlaybackAdapter.AudioPlaybackAdapter({registry:reg,Audio:ErrorAudio,speechSynthesis:okSynth,Utterance:U,AudioContext:null});await a.enable();out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'));check(out.successfulMode==='TTS','WAV_ERROR_TO_TTS');check(out.reasonCodes.includes('ASSET_DECODE_FAILED'),'WAV_ERROR_REASON');
a=new AudioPlaybackAdapter.AudioPlaybackAdapter({registry:reg,Audio:RejectAudio,speechSynthesis:failSynth,Utterance:U,AudioContext:null});await a.enable();out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'));check(out.deliveryState==='DELIVERY_UNAVAILABLE','ALL_FAILED');check(out.attemptedModes.join(',')==='LOCAL_WAV,TTS,TONE_ONLY','FULL_ORDER');check(out.reasonCodes.includes('synthesis-failed'),'TTS_REASON');check(out.successfulMode===null,'FAILED_NOT_PLAYED');
a=new AudioPlaybackAdapter.AudioPlaybackAdapter({registry:reg,Audio:FakeAudio,speechSynthesis:okSynth,Utterance:U,AudioContext:null});await a.enable();a.setMuted(true);out=await a.deliver(VoiceMessageCatalog.get('DROWSINESS_EARLY_WARNING'));check(out.deliveryState==='CANCELLED','MUTED');check(a.getState().muted,'MUTE_STATE');a.setMuted(false);check(!a.getState().muted,'UNMUTE_STATE');check(a.getState().operationalUseAllowed===false,'PLAYBACK_GUARD');
const source=[LocalAudioAssetRegistry.toString(),AudioPlaybackAdapter.AudioPlaybackAdapter.toString(),JSON.stringify(manifest)].join(' ');check(!/getUserMedia|SpeechRecognition/.test(source),'NO_MICROPHONE');check(!/localStorage|sessionStorage|indexedDB/.test(source),'NO_STORAGE');check(!/WebSocket|XMLHttpRequest|sendBeacon/.test(source),'NO_NETWORK_API');check(!/data:audio|;base64/.test(source),'NO_BASE64_AUDIO');check(!/https?:\/\//.test(JSON.stringify(manifest)),'NO_EXTERNAL_URL');check(manifest.operationalUseAllowed!==true&&manifest.assets.every(x=>x.operationalUseAllowed===false),'MANIFEST_GUARD');check(pass.length>=50,'MINIMUM_50');document.title=`PASS - Local WAV Audio Delivery (${pass.length})`;results.textContent=pass.join('\n')})().catch(e=>{document.title='FAIL - Local WAV Audio Delivery';results.textContent=e.stack;throw e})</script></body></html>
