(()=>{'use strict';

 x=calc.processFrame(frame(4000,.6),cal);x=calc.processFrame(frame(5100,.6),cal);x=calc.processFrame(frame(5200,.1),cal);x=calc.processFrame(frame(5550,.1),cal);ok(x.yawnCount===2,'TWO_EPISODES');const count=x.yawnCount;x=calc.processFrame(frame(5700,.6,false),cal);ok(x.yawnState==='INVALID'&&x.yawnCount===count,'FACE_LOSS');x=calc.processFrame(frame(7000,.6),cal);ok(x.yawnState==='INVALID','STALE_RESET');calc.reset();x=calc.processFrame(frame(7100,.1),cal);ok(x.yawnCount===0,'RESET');

 const context={vehicleType:'FORKLIFT',vehicleId:'F03',driverId:'D1',driverAssignmentId:'A1'},obs=DriverState.createDriverObservation({context,observationType:'DROWSINESS',value:'live-driver-state',unit:'composite-driver-state',confidence:null,observedAt:new Date(8000),metadata:{sensorId:'cam',sensorType:'DRIVER_CAMERA',source:'live-webcam',simulation:false,sensorConnected:true,measurementStatus:'VALID',sampleWindowMs:0,algorithmVersion:'v',configurationVersion:'v',operationalUseAllowed:false,metrics:{ear:.3,earThreshold:.2,eyeClosed:false,eyeClosureDurationMs:0,perclos:10,yawnConfirmed:true,yawnCount:1},quality:{confidenceAvailable:false,faceDetected:true,landmarkAvailable:true,calibrated:true,calibrationState:'READY',earValid:true,perclosValid:true,sampleAgeMs:0,marValid:true,mouthCalibrationAvailable:true,yawnMetricAvailable:true}}});
