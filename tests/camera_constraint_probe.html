<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>C922 Constraint Isolation Probe</title>
<style>body{font:14px system-ui;background:#07101f;color:#e2e8f0;margin:2rem}button{padding:.65rem 1rem}pre{white-space:pre-wrap;background:#0f172a;padding:1rem;border-radius:.5rem}video{width:1px;height:1px;opacity:0;position:absolute}</style></head>
<body><h1>C922 Constraint Isolation Probe</h1><p>Browser-memory-only diagnostic. No MediaPipe or application runtime is loaded.</p>
<button id="run" type="button">RUN SEQUENTIAL PROBE</button><strong id="state"> READY</strong><video id="probeVideo" muted playsinline></video><pre id="result">{}</pre>
<script>
(()=>{'use strict';
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms)),mask=value=>value?`…${String(value).slice(-8)}`:null,video=document.getElementById('probeVideo'),output=document.getElementById('result'),state=document.getElementById('state');let running=false,lastResult=null;
const clone=value=>JSON.parse(JSON.stringify(value)),safeCapabilities=track=>{try{return typeof track.getCapabilities==='function'?track.getCapabilities():null}catch(error){return{error:error.message}}};
const stopStream=async stream=>{const verification=[];for(const track of stream?.getTracks?.()||[]){const before=track.readyState;track.stop();verification.push({kind:track.kind,before,after:track.readyState})}video.srcObject=null;await wait(500);return verification};
const attempt=async profile=>{const started=performance.now(),startedAt=new Date().toISOString();let stream=null;try{stream=await navigator.mediaDevices.getUserMedia(profile.constraints);const track=stream.getVideoTracks()[0],settings=track?.getSettings?.()||{},result={profile:profile.name,startedAt,endedAt:new Date().toISOString(),elapsedMs:Math.round(performance.now()-started),success:true,error:null,track:{label:track?.label||null,readyState:track?.readyState||null,muted:track?.muted??null,enabled:track?.enabled??null,settings:{...settings,deviceId:mask(settings.deviceId),groupId:mask(settings.groupId)},capabilities:safeCapabilities(track)},stopVerification:[]};result.stopVerification=await stopStream(stream);return result}catch(error){if(stream)await stopStream(stream);else{video.srcObject=null;await wait(500)}return{profile:profile.name,startedAt,endedAt:new Date().toISOString(),elapsedMs:Math.round(performance.now()-started),success:false,error:{name:error?.name||'Error',message:error?.message||String(error),constraint:error?.constraint||null},track:null,stopVerification:[]}}};
const permission=async()=>{try{return(await navigator.permissions.query({name:'camera'})).state}catch(_){return'UNAVAILABLE'}};
async function run(){if(running)return;running=true;state.textContent=' RUNNING';const base={userAgent:navigator.userAgent,secureContext:window.isSecureContext,mediaDevicesAvailable:Boolean(navigator.mediaDevices?.getUserMedia),permissionState:await permission(),startedAt:new Date().toISOString(),storageUsed:false,networkUsed:false};try{if(!base.mediaDevicesAvailable)throw Error('MEDIA_DEVICES_UNAVAILABLE');const devices=await navigator.mediaDevices.enumerateDevices(),cameras=devices.filter(x=>x.kind==='videoinput'),selected=cameras.find(x=>/c922/i.test(x.label));if(!selected)throw Error('C922_NOT_FOUND');base.videoDeviceCount=cameras.length;base.selectedDevice={deviceId:mask(selected.deviceId),label:selected.label,groupId:mask(selected.groupId)};const id=selected.deviceId,profiles=[{name:'A_VIDEO_TRUE',constraints:{video:true,audio:false}},{name:'B_DEVICE_ID_IDEAL_STRING',constraints:{video:{deviceId:id},audio:false}},{name:'C_DEVICE_ID_EXACT',constraints:{video:{deviceId:{exact:id}},audio:false}},{name:'D_640_480_30_IDEAL',constraints:{video:{deviceId:{exact:id},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30}},audio:false}},{name:'E_1280_720_30_IDEAL',constraints:{video:{deviceId:{exact:id},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false}},{name:'F_320_240_15_IDEAL',constraints:{video:{deviceId:{exact:id},width:{ideal:320},height:{ideal:240},frameRate:{ideal:15}},audio:false}}];base.attempts=[];for(const profile of profiles){base.attempts.push(await attempt(profile));output.textContent=JSON.stringify(base,null,2)}base.endedAt=new Date().toISOString();base.attemptsSequential=true;base.allSuccessfulTracksStopped=base.attempts.filter(x=>x.success).every(x=>x.stopVerification.every(t=>t.after==='ended'));base.srcObjectCleared=video.srcObject===null;lastResult=clone(base);state.textContent=' COMPLETE';document.title='COMPLETE - C922 Constraint Isolation Probe'}catch(error){base.fatalError={name:error.name,message:error.message};lastResult=clone(base);state.textContent=' ERROR';document.title='ERROR - C922 Constraint Isolation Probe'}finally{output.textContent=JSON.stringify(lastResult,null,2);running=false}}
document.getElementById('run').addEventListener('click',run);window.CameraConstraintProbe=Object.freeze({run,getResult:()=>clone(lastResult),isRunning:()=>running});
})();
</script></body></html>
