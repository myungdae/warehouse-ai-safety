<!doctype html><html><head><meta charset="utf-8"><title>Runtime Replay</title></head><body><pre id="result"></pre><script src="../backend/static/js/runtime_replay_session.js"></script><script src="../backend/static/js/runtime_explanation_engine.js"></script><script src="../backend/static/js/runtime_replay_engine.js"></script><script>(()=>{'use strict';const pass=[],check=(v,n)=>{if(!v)throw Error(n);pass.push(n)},throws=(fn,n)=>{let yes=false;try{fn()}catch(_){yes=true}check(yes,n)};let now=Date.parse('2026-08-03T16:00:00Z'),scheduled=[],cancelled=[],sequence=0,target='vehicle-r|driver-r|assignment-r',at=offset=>new Date(now+offset).toISOString(),event=(eventType,offset,payload={},source='FIXTURE')=>({timestamp:at(offset),sequence:++sequence,eventType,source,payload,simulation:true});
let model=new RuntimeReplaySession.ReplayEvent(event('Observation',0,{observationId:'o-model',value:1}));check(Object.isFrozen(model)&&Object.isFrozen(model.payload),'EVENT_IMMUTABLE');check(model.operationalUseAllowed===false&&model.simulation,'EVENT_SAFETY');check(JSON.parse(JSON.stringify(model)).payload.value===1,'EVENT_JSON_SAFE');throws(()=>new RuntimeReplaySession.ReplayEvent({...event('Observation',1),sequence:-1}),'SEQUENCE_REJECTED');throws(()=>new RuntimeReplaySession.ReplayEvent(event('BAD',2)),'TYPE_REJECTED');throws(()=>new RuntimeReplaySession.ReplayEvent(event('Observation',3,{frame:{}})),'FRAME_REJECTED');throws(()=>new RuntimeReplaySession.ReplayEvent(event('Observation',4,{image:'x'})),'IMAGE_REJECTED');throws(()=>new RuntimeReplaySession.ReplayEvent(event('Observation',5,{video:'x'})),'VIDEO_REJECTED');throws(()=>new RuntimeReplaySession.ReplayEvent(event('Observation',6,{base64:'x'})),'BASE64_REJECTED');let session=new RuntimeReplaySession.ReplaySession({sessionId:'s-model',startedAt:at(0),canonicalTarget:target,assignment:'assignment-r',runtimeVersion:'v1',eventCount:2,status:'READY'});check(Object.isFrozen(session)&&session.eventCount===2,'SESSION_IMMUTABLE');check(session.operationalUseAllowed===false&&session.status==='READY','SESSION_SAFETY_STATUS');RuntimeReplaySession.EventType.forEach(type=>check(new RuntimeReplaySession.ReplayEvent(event(type,++sequence)).eventType===type,`TYPE_${type}`));RuntimeReplayEngine.PlaybackState.forEach(state=>check(typeof state==='string',`PLAYBACK_${state}`));
sequence=0;const events=[event('RecommendationChanged',800,{recommendationId:'rec-1',decisionMode:'WARNING_WITH_CAUTION',recommendedActions:['VERIFY'],gatedActions:['SAFE_STOP_REQUEST'],verificationRequired:true,reasonCodes:['LOW_CONFIDENCE']},'CONFIDENCE'),event('Observation',100,{observationId:'obs-1',observationType:'DRIVER_ATTENTION',targetId:target,value:'DISTRACTED',confidence:null,observedAt:at(100),metadata:{quality:{confidenceAvailable:false}}},'ATTENTION'),event('RiskCreated',200,{eventId:'risk-1',eventType:'DRIVER_DISTRACTION',targetId:target,state:'NEW',severity:'MEDIUM',sourceEventId:'obs-1'},'RISK'),event('RiskActivated',300,{eventId:'risk-1',eventType:'DRIVER_DISTRACTION',targetId:target,state:'ACTIVE',severity:'MEDIUM',sourceEventId:'obs-1'},'RISK'),event('IdentityChanged',0,{identityId:'identity-1',canonicalTargetId:target,driverAssignmentId:'assignment-r'},'IDENTITY'),event('OperationalContextChanged',400,{contextId:'ctx-1',canonicalTargetId:target,driverAssignmentId:'assignment-r',activeRiskTypes:['DRIVER_DISTRACTION'],conditions:['VEHICLE_MOVING']},'FUSION'),event('CompositeRiskChanged',500,{compositeRiskId:'composite-1',contextId:'ctx-1',priorityScore:72,priorityBand:'HIGH',dominantRiskType:'DRIVER_DISTRACTION',contributingRiskTypes:['DRIVER_DISTRACTION'],reasonCodes:['RISK_DRIVER_DISTRACTION']},'FUSION'),event('PriorityChanged',600,{priorityDecisionId:'priority-1',priorityScore:72,priorityBand:'HIGH',selectedPolicy:'VOICE_WARNING',reasonCodes:['RISK_DRIVER_DISTRACTION']},'FUSION'),event('ConfidenceChanged',700,{confidenceId:'confidence-1',overallConfidence:42,confidenceBand:'LOW',reasonCodes:['SINGLE_SOURCE_ONLY']},'CONFIDENCE'),event('RiskAcknowledged',900,{eventId:'risk-1',eventType:'DRIVER_DISTRACTION',targetId:target,state:'ACKNOWLEDGED',severity:'MEDIUM'},'RISK'),event('ReplayMarker',1000,{marker:'RECOVERY_STARTED'}),event('RiskCleared',1100,{eventId:'risk-1',eventType:'DRIVER_DISTRACTION',targetId:target,state:'CLEARED',severity:'MEDIUM'},'RISK')];const engine=new RuntimeReplayEngine.ReplayEngine({now:()=>now,scheduler:fn=>{scheduled.push(fn);return scheduled.length-1},canceller:id=>cancelled.push(id)});session=engine.createSession({sessionId:'replay-1',canonicalTarget:target,assignment:'assignment-r',runtimeVersion:'v13'},events);check(session.eventCount===12&&session.status==='READY','CREATE_SESSION');check(engine.getPlaybackState().state==='READY'&&engine.getPlaybackState().cursor===-1,'INITIAL_READY');const timeline=engine.getTimeline();check(timeline.every((item,index)=>!index||Date.parse(item.timestamp)>=Date.parse(timeline[index-1].timestamp)),'TIMELINE_SORTED');check(timeline[0].eventType==='IdentityChanged'&&timeline.at(-1).eventType==='RiskCleared','TIMELINE_ORDER');check(engine.getAuditHistory()[0].eventType==='SESSION_CREATED','CREATE_AUDIT');
let snap=engine.step();check(engine.getPlaybackState().state==='PAUSED'&&snap.identity.identityId==='identity-1','STEP_IDENTITY');snap=engine.step();check(Object.values(snap.observations)[0].observationId==='obs-1','STEP_OBSERVATION');snap=engine.restoreAt(3);check(snap.cursor===3&&Object.values(snap.risks)[0].state==='ACTIVE','RESTORE_ACTIVE');check(snap.context===null&&snap.recommendation===null,'RESTORE_POINT_IN_TIME');snap=engine.restoreAt(8);check(snap.context.contextId==='ctx-1'&&snap.compositeRisk.compositeRiskId==='composite-1','RESTORE_CONTEXT_COMPOSITE');check(snap.priority.priorityDecisionId==='priority-1'&&snap.confidence.confidenceId==='confidence-1','RESTORE_PRIORITY_CONFIDENCE');check(snap.recommendation.recommendationId==='rec-1','RESTORE_RECOMMENDATION');const explanation=engine.explain();check(explanation.chain[0].artifactType==='Recommendation','EXPLAIN_RECOMMENDATION_FIRST');check(explanation.chain.some(x=>x.artifactType==='CompositeRisk')&&explanation.chain.some(x=>x.artifactType==='Observation'),'EXPLAIN_ARTIFACT_CHAIN');check(explanation.statement.includes('recorded runtime artifacts'),'EXPLAIN_NO_NEW_INFERENCE');check(engine.getAuditHistory().some(x=>x.eventType==='EXPLANATION_REQUESTED'),'EXPLANATION_AUDIT');snap=engine.restoreAt(11);check(Object.values(snap.risks)[0].state==='CLEARED'&&snap.markers[0].marker==='RECOVERY_STARTED','ACK_RECOVERY_CLEAR_RESTORE');check(snap.graph.nodes.length===24&&snap.graph.edges.length===12,'GRAPH_REPLAY');check(snap.triples.length===36&&snap.triples.every(x=>x.subject.startsWith('ReplayEvent:')),'TRIPLE_REPLAY');
engine.reset();check(engine.getPlaybackState().state==='READY'&&engine.getSnapshot().cursor===-1,'RESET_READY');engine.play({intervalMs:10});check(engine.getPlaybackState().state==='PLAYING'&&scheduled.length===1,'PLAY_STARTED');scheduled.shift()();check(engine.getPlaybackState().cursor===0,'PLAY_TICK');engine.pause();check(engine.getPlaybackState().state==='PAUSED'&&cancelled.length>0,'PAUSE_CANCEL');engine.play({intervalMs:10});while(scheduled.length)scheduled.shift()();check(engine.getPlaybackState().state==='FINISHED'&&engine.getPlaybackState().cursor===11,'PLAY_FINISHED');check(engine.getAuditHistory().some(x=>x.eventType==='PLAYBACK_STARTED')&&engine.getAuditHistory().some(x=>x.eventType==='PLAYBACK_PAUSED')&&engine.getAuditHistory().some(x=>x.eventType==='PLAYBACK_FINISHED'),'PLAYBACK_AUDIT');const exported=JSON.parse(engine.exportJSON());check(exported.session.sessionId==='replay-1'&&exported.timeline.length===12,'EXPORT_SESSION_TIMELINE');check(exported.snapshot.cursor===11&&exported.graphSummary.nodeCount===24&&exported.tripleSummary.tripleCount===36,'EXPORT_SNAPSHOT_LINEAGE');check(exported.audit.some(x=>x.eventType==='EXPORT_REQUESTED'),'EXPORT_AUDIT');check(exported.snapshot.operationalUseAllowed===false&&exported.session.operationalUseAllowed===false,'EXPORT_OPERATIONAL_GUARD');const copy=engine.getSnapshot();copy.risks['risk-1'].state='MUTATED';check(Object.values(engine.getSnapshot().risks)[0].state==='CLEARED','DEFENSIVE_SNAPSHOT');throws(()=>engine.restoreAt(99),'INVALID_CURSOR');const duplicateEngine=new RuntimeReplayEngine.ReplayEngine();throws(()=>duplicateEngine.createSession({sessionId:'dup',canonicalTarget:target,assignment:'assignment-r',runtimeVersion:'v1'},[{timestamp:at(0),sequence:1,eventType:'ReplayMarker',source:'x',payload:{}},{timestamp:at(0),sequence:1,eventType:'ReplayMarker',source:'x',payload:{}}]),'DUPLICATE_ORDER_REJECTED');const source=RuntimeReplayEngine.ReplayEngine.toString()+RuntimeReplaySession.ReplayEvent.toString()+RuntimeExplanationEngine.ExplanationEngine.toString();check(!/fetch\s*\(|XMLHttpRequest|WebSocket|sendBeacon|getUserMedia|localStorage|sessionStorage|indexedDB|FileReader|showSaveFilePicker/.test(source),'NO_NETWORK_FILESYSTEM_STORAGE');check(!/mp4|avi|camera recording|CAN recording/i.test(source),'NO_MEDIA_CAN_RECORDING');check(pass.length>=60,'MINIMUM_ASSERTIONS');document.title=`PASS - Runtime Replay (${pass.length})`;result.textContent=pass.join('\n')})()</script></body></html>
