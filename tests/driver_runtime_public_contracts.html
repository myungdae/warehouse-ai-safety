<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Driver Runtime Public Contracts</title></head>
<body>
<form id="driverStateTestForm"><select id="driverVehicleType"><option>FORKLIFT</option></select><input id="driverVehicleId" value="F-03"><input id="driverId" value="DRIVER001"><input id="driverAssignmentId" value="ASSIGNMENT001"><select id="driverObservationType"><option>DROWSINESS</option></select><button id="drowsinessTestButton" type="submit">RUN</button></form>
<span id="driverTargetId"></span><pre id="vehicleContextOutput"></pre><pre id="lastDriverObservation"></pre><pre id="driverSequenceStatus"></pre><pre id="driverAdapterStatus"></pre><pre id="lastDriverRiskSignal"></pre><pre id="driverRiskEventHistory"></pre><pre id="driverCurrentEventId"></pre><pre id="driverCurrentEventState"></pre><pre id="driverCompositeSignalCount"></pre><pre id="driverQualityValid"></pre><pre id="driverVehicleMoving"></pre><pre id="result">RUNNING</pre>
<script src="../backend/static/js/sensor_observation.js"></script><script src="../backend/static/js/driver_state_config.js"></script><script src="../backend/static/js/driver_state.js"></script><script src="../backend/static/js/driver_sensor_adapters.js"></script><script src="../backend/static/js/driver_risk_runtime.js"></script><script src="../backend/static/js/driver_policy_config.js"></script><script src="../backend/static/js/driver_policy_engine.js"></script><script src="../backend/static/js/driver_action_config.js"></script><script src="../backend/static/js/driver_action_dispatcher.js"></script><script src="../backend/static/js/driver_input_mode_controller.js"></script><script src="../backend/static/js/driver_runtime_page.js"></script>
<script>
(function run(){'use strict';const assert=(condition,message)=>{if(!condition)throw new Error(message);};const output=document.getElementById('result');const timers=new Map();let timerId=0;window.setTimeout=callback=>{timerId++;timers.set(timerId,{callback,cleared:false});return timerId;};window.clearTimeout=id=>{if(timers.has(id))timers.get(id).cleared=true;};
try{
  const S=SafetyObservation,D=DriverState,A=DriverSensorAdapters,R=DriverRiskRuntime,P=DriverPolicy,Actions=DriverActions,M=DriverInputModeController;
  const observationInput=confidence=>({observationId:`obs-${String(confidence)}`,observationType:'DROWSINESS',sensorId:'camera',targetId:'F03|DRIVER001|ASSIGNMENT001',value:'NORMAL',unit:'driver-state',confidence,observedAt:new Date(0),metadata:{quality:{confidenceAvailable:confidence!==null}}});
  [0,.5,1,null].forEach(value=>{const item=new S.SensorObservation(observationInput(value));assert(item.toJSON().confidence===value,`confidence ${value}`);});
  [NaN,Infinity,'0.5'].forEach(value=>{let rejected=false;try{new S.SensorObservation(observationInput(value));}catch(_){rejected=true;}assert(rejected,`invalid confidence accepted: ${value}`);});
  assert(new S.SensorObservation(observationInput(null)).toJSON().metadata.quality.confidenceAvailable===false,'confidence availability lost');
  let missingAvailability=false;try{new S.SensorObservation({...observationInput(null),metadata:{quality:{}}});}catch(_){missingAvailability=true;}assert(missingAvailability,'null confidence accepted without availability marker');

  const statePage=D.initializeDriverStatePage();document.getElementById('driverStateTestForm').requestSubmit(document.getElementById('drowsinessTestButton'));const target='F03|DRIVER001|ASSIGNMENT001';assert(statePage.isDeterministicRunActive(target),'run not active');const other=statePage.cancelDeterministicRun({targetId:'F04|DRIVER001|ASSIGNMENT001',observationType:'DROWSINESS'});assert(!other.cancelled&&statePage.isDeterministicRunActive(target),'other target cancelled');const stale=Array.from(timers.values()).find(timer=>!timer.cleared);const cancelled=statePage.cancelDeterministicRun({targetId:target,observationType:'DROWSINESS',reason:'SWITCH_TO_LIVE',preserveAuditHistory:true});assert(cancelled.cancelled&&!statePage.isDeterministicRunActive(target)&&stale.cleared,'target cancellation failed');const generation=cancelled.generation;stale.callback();assert(statePage.getDeterministicRunState(target).generation===generation,'stale callback advanced run');assert(!statePage.cancelDeterministicRun({targetId:target,observationType:'DROWSINESS'}).cancelled,'cancel not idempotent');assert(statePage.getDeterministicRunState(target).cancellationAuditHistory.length===1,'audit not preserved');assert(!statePage.getRiskEventHistory().some(event=>event.state==='CLEARED'),'cancel cleared risk');

  let deterministicCancels=0,liveReleases=0;const modes=new M.DriverInputModeController({cancelDeterministicRun:()=>{deterministicCancels++;return{cancelled:true};}});modes.registerSource({sourceId:'simulation',mode:M.Mode.DETERMINISTIC_SIMULATION});modes.registerSource({sourceId:'live',mode:M.Mode.LIVE_WEBCAM,onRelease:()=>liveReleases++});const sim=modes.activateMode({observationType:'DROWSINESS',targetId:target,mode:M.Mode.DETERMINISTIC_SIMULATION,sourceId:'simulation'});assert(modes.canPublish({...sim}),'simulation owner blocked');const live=modes.activateMode({observationType:'DROWSINESS',targetId:target,mode:M.Mode.LIVE_WEBCAM,sourceId:'live'});assert(deterministicCancels===1&&!modes.canPublish({...sim})&&modes.canPublish({...live}),'live switch failed');const simAgain=modes.activateMode({observationType:'DROWSINESS',targetId:target,mode:M.Mode.DETERMINISTIC_SIMULATION,sourceId:'simulation'});assert(liveReleases===1&&!modes.canPublish({...live})&&modes.canPublish({...simAgain}),'simulation switch failed');const assignment2='F03|DRIVER001|ASSIGNMENT002';const live2=modes.activateMode({observationType:'DROWSINESS',targetId:assignment2,mode:M.Mode.LIVE_WEBCAM,sourceId:'live'});assert(modes.getMode('DROWSINESS',target)===M.Mode.DETERMINISTIC_SIMULATION&&modes.getMode('DROWSINESS',assignment2)===M.Mode.LIVE_WEBCAM,'assignment isolation failed');assert(!modes.deactivateMode({observationType:'DROWSINESS',targetId:assignment2,sourceId:'live',token:'stale'}),'stale token accepted');assert(modes.releaseTarget(assignment2).length===1&&modes.getMode('DROWSINESS',assignment2)===M.Mode.STOPPED,'release failed');

  const policyEngine=new P.DriverPolicyEngine(),dispatcher=new Actions.DriverActionDispatcher();const facade=new DriverRuntimePage.DriverRuntimePageFacade({driverStatePage:statePage,policyPage:{engine:policyEngine,render(){}},actionPage:{dispatcher,render(){}},inputModeController:modes});const context=new D.VehicleContext({vehicleType:'FORKLIFT',vehicleId:'F-03',driverId:'DRIVER001',driverAssignmentId:'ASSIGNMENT001'});const event={eventId:'event-1',eventType:'DROWSINESS',targetId:context.targetId,state:'NEW',severity:'HIGH',createdTime:new Date(100).toISOString(),updatedTime:new Date(100).toISOString()};const first=facade.ingestRiskEvent(event,context);const duplicate=facade.ingestRiskEvent(event,context);assert(first.decision.decisionId===duplicate.decision.decisionId&&policyEngine.getDriverPolicyDecisions().length===1,'event dedup failed');assert(first.actions.length===1&&first.executions.length===1&&first.executions[0].simulation===true&&!first.executions[0].actuatorConnected&&!first.executions[0].operationalUseAllowed,'simulation execution guard failed');let mismatch=false;try{facade.ingestRiskEvent({...event,eventId:'event-2',targetId:assignment2},context);}catch(_){mismatch=true;}assert(mismatch,'target mismatch accepted');const ackMachine=statePage.getRiskEventStateMachine();const risk=ackMachine.observe({eventType:'DROWSINESS',targetId:context.targetId,severity:'HIGH'},new Date(200));const ack=facade.acknowledgeRisk(risk.eventId,new Date(300));assert(ack&&policyEngine.getActiveDriverPolicies().some(item=>item.sourceEventId===risk.eventId),'ACK not ingested');const pendingBefore=facade.getExecutionState(context.targetId).length;const sourceCancelled=facade.cancelPendingExecutionsForSource('event-1','PUBLIC_CONTRACT_TEST_CANCEL');assert(sourceCancelled[0].reasonCode==='PUBLIC_CONTRACT_TEST_CANCEL','cancel reason lost');assert(facade.getExecutionState(context.targetId).length===pendingBefore&&facade.getExecutionState(context.targetId).some(item=>item.sourceEventId==='event-1'&&item.state==='CANCELLED'),'source cancel failed');facade.ingestRiskEvent({...event,state:'CLEARED',updatedTime:new Date(400).toISOString()},context);assert(!facade.getPolicyState(context.targetId).some(item=>item.sourceEventId==='event-1'),'CLEARED policy stayed active');

  const deterministic=new A.DeterministicDriverTestAdapter();const chainContext=new D.VehicleContext({vehicleType:'FORKLIFT',vehicleId:'F-03',driverId:'DRIVER001',driverAssignmentId:'ASSIGNMENT-E2E'});R.resetDrowsinessRiskState(chainContext.targetId);const sequence=deterministic.createSequence({context:chainContext,observationType:'DROWSINESS',startedAt:1000,runId:'public-contract'});const noRisk=facade.ingestObservation(sequence[0]);assert(!noRisk.riskEvent,'normal created risk');facade.ingestObservation(sequence[1]);const chain=facade.ingestObservation(sequence[2]);assert(chain.riskEvent&&chain.policyDecision&&chain.actionRequests.length&&chain.actionExecutions.length,'public end-to-end path incomplete');assert(chain.actionExecutions.every(item=>item.simulation&&!item.actuatorConnected&&!item.operationalUseAllowed),'execution safety changed');
  output.textContent='PASS\nNullable confidence, deterministic cancellation, ownership isolation, policy/dispatcher facade, deterministic public path';document.title='PASS - Driver Runtime Public Contracts';
}catch(error){output.textContent=`FAIL\n${error.stack||error.message}`;document.title='FAIL - Driver Runtime Public Contracts';throw error;}})();
</script></body></html>
