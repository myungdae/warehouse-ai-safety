<!doctype html><html><head><meta charset="utf-8"><title>RUNNING - Driver Runtime Memory</title></head><body><pre id="results"></pre><script src="../backend/static/js/driver_runtime_memory_config.js"></script><script src="../backend/static/js/driver_runtime_memory_model.js"></script><script src="../backend/static/js/driver_fatigue_trend_engine.js"></script><script src="../backend/static/js/driver_runtime_memory_engine.js"></script><script>(async()=>{'use strict';const pass=[],check=(v,n)=>{if(!v)throw Error(n);pass.push(n)},C=DriverRuntimeMemoryConfig,E=DriverRuntimeMemoryEngine.DriverRuntimeMemoryEngine,T=DriverFatigueTrendEngine.DriverFatigueTrendEngine;check(Object.keys(C.windows).length===6,'WINDOW_COUNT');check(C.windows.THIRTY_SECONDS===30000,'WINDOW_30S');check(C.windows.ONE_MINUTE===60000,'WINDOW_1M');check(C.windows.FIVE_MINUTES===300000,'WINDOW_5M');check(C.windows.FIFTEEN_MINUTES===900000,'WINDOW_15M');check(C.windows.THIRTY_MINUTES===1800000,'WINDOW_30M');check(C.windows.SIXTY_MINUTES===3600000,'WINDOW_60M');check(C.operationalUseAllowed===false,'CONFIG_GUARD');
let now=4000000,e=new E({now:()=>now}),base={canonicalTargetId:'t1',assignmentId:'a1'};check(e.ingest({assignmentId:'a1',metric:'BLINK',value:1})===null,'TARGET_REQUIRED');check(e.ingest({canonicalTargetId:'t1',metric:'BLINK',value:1})===null,'ASSIGNMENT_REQUIRED');for(let i=0;i<10;i++){const timestamp=now-270000+i*30000;e.ingest({...base,metric:'BLINK',value:1,timestamp});e.ingest({...base,metric:'YAWN',value:i<5?0:1,timestamp,durationMs:i*100});e.ingest({...base,metric:'PERCLOS',value:i/10,timestamp});e.ingest({...base,metric:'ATTENTION_LOSS',value:i<5?0:1,timestamp,durationMs:i*50});e.ingest({...base,metric:'LONG_EYE_CLOSURE',value:i<7?0:1,timestamp,durationMs:1000});e.ingest({...base,metric:'HEAD_DOWN',value:i*100,timestamp,durationMs:i*100});e.ingest({...base,metric:'CONFIDENCE',value:.9,timestamp})}let m=e.getMemory('t1','a1');check(Object.isFrozen(m),'MEMORY_FROZEN');check(Object.isFrozen(m.windowSnapshots),'WINDOWS_FROZEN');check(JSON.parse(JSON.stringify(m)).canonicalTargetId==='t1','JSON_SAFE');check(m.simulation&&m.operationalUseAllowed===false,'MEMORY_GUARD');check(m.totalObservationCount===70,'OBSERVATION_COUNT');check(m.validObservationCount===70,'VALID_COUNT');Object.entries(m.windowSnapshots).forEach(([code,w])=>{check(w.windowCode===code,`CODE_${code}`);check(Number.isFinite(w.durationMs),`DURATION_${code}`);check(w.sampleCount>=0,`COUNT_${code}`);check(w.validSampleCount>=0,`VALID_${code}`);check(w.completeness>=0&&w.completeness<=1,`COMPLETE_${code}`);check(Object.keys(w.statistics).length===C.metrics.length,`METRICS_${code}`);C.metrics.forEach(metric=>{const s=w.statistics[metric];check('count'in s,`COUNT_${code}_${metric}`);check('frequencyPerMinute'in s,`FREQ_${code}_${metric}`);check('mean'in s,`MEAN_${code}_${metric}`);check('median' in {median:s.durationMedianMs},`MEDIAN_${code}_${metric}`);check('delta'in s,`DELTA_${code}_${metric}`);check('percentChange'in s,`PERCENT_${code}_${metric}`);check('missingRatio'in s,`MISSING_${code}_${metric}`)})});let s=m.windowSnapshots.FIVE_MINUTES.statistics;check(s.PERCLOS.mean>.4,'MEAN_VALUE');check(s.PERCLOS.min===0&&s.PERCLOS.max===.9,'MIN_MAX');check(s.YAWN.durationMedianMs===450,'MEDIAN_VALUE');check(s.PERCLOS.delta>0,'DELTA_VALUE');check(s.PERCLOS.percentChange!==null,'PERCENT_VALUE');
e.ingest({...base,metric:'PERCLOS',value:0,timestamp:now});e.ingest({...base,metric:'PERCLOS',value:1,timestamp:now,valid:false});m=e.getMemory('t1','a1');check(m.windowSnapshots.THIRTY_SECONDS.statistics.PERCLOS.validRatio>0&&m.windowSnapshots.THIRTY_SECONDS.statistics.PERCLOS.validRatio<1,'VALID_RATIO');check(m.windowSnapshots.THIRTY_SECONDS.statistics.PERCLOS.missingRatio>0&&m.windowSnapshots.THIRTY_SECONDS.statistics.PERCLOS.missingRatio<1,'MISSING_RATIO');e.ingest({...base,metric:'EAR',value:NaN,timestamp:now});m=e.getMemory('t1','a1');check(m.windowSnapshots.THIRTY_SECONDS.statistics.EAR.mean===null,'NAN_DEFENSE');check(m.windowSnapshots.THIRTY_SECONDS.statistics.MAR.percentChange===null,'ZERO_DEFENSE');
const t=new T(),curr={PERCLOS:.5,YAWN:3,LONG_EYE_CLOSURE:2,ATTENTION_LOSS:4,HEAD_DOWN:4,DROWSINESS_RISK:3,VOICE_ESCALATION:2},prev={PERCLOS:.1,YAWN:0,LONG_EYE_CLOSURE:0,ATTENTION_LOSS:0,HEAD_DOWN:0,DROWSINESS_RISK:0,VOICE_ESCALATION:0};let trend=t.evaluate({current:curr,previous:prev,confidence:1});check(['RAPID_INCREASE','CRITICAL'].includes(trend.trendCode),'RAPID');check(trend.contributingSignals.length>=4,'CONTRIBUTING');trend=t.evaluate({current:prev,previous:curr,confidence:1});check(trend.trendCode==='IMPROVING','IMPROVING');trend=t.evaluate({current:prev,previous:prev,confidence:1});check(trend.trendCode==='STABLE','STABLE');trend=t.evaluate({current:{PERCLOS:.2,YAWN:1,LONG_EYE_CLOSURE:0,ATTENTION_LOSS:0},previous:{PERCLOS:.1,YAWN:0,LONG_EYE_CLOSURE:0,ATTENTION_LOSS:0},confidence:1});check(['MILD_INCREASE','INCREASING'].includes(trend.trendCode),'MILD_OR_INCREASING');trend=t.evaluate({current:{},previous:{},confidence:1});check(trend.trendCode==='UNKNOWN','UNKNOWN');trend=t.evaluate({current:{PERCLOS:1},previous:{PERCLOS:0},confidence:1});check(trend.trendCode==='INSUFFICIENT_DATA','INSUFFICIENT');trend=t.evaluate({current:curr,previous:prev,confidence:.2});check(trend.confidence===.2,'LOW_CONFIDENCE');check(!['CRITICAL','RAPID_INCREASE'].includes(trend.trendCode),'LOW_CONFIDENCE_CAP');
const isoEngine=new E({now:()=>now});isoEngine.ingest({canonicalTargetId:'A',assignmentId:'one',metric:'YAWN',value:1,timestamp:now});isoEngine.ingest({canonicalTargetId:'B',assignmentId:'two',metric:'YAWN',value:2,timestamp:now});check(isoEngine.getMemory('A','one').totalObservationCount===1,'TARGET_ISOLATION');check(isoEngine.getMemory('B','two').totalObservationCount===1,'TARGET_ISOLATION_2');check(isoEngine.getMemory('A','two')===null,'ASSIGNMENT_ISOLATION');isoEngine.resetAssignment('one');check(isoEngine.getMemory('A','one')===null,'ASSIGNMENT_RESET');check(isoEngine.getMemory('B','two')!==null,'RESET_ISOLATED');isoEngine.resetTarget('B');check(isoEngine.getMemory('B','two')===null,'TARGET_RESET');
const exp=new E({now:()=>now});exp.ingest({...base,metric:'BLINK',value:1,timestamp:now-3600001});exp.ingest({...base,metric:'BLINK',value:1,timestamp:now});check(exp.getMemory('t1','a1').totalObservationCount===1,'WINDOW_EXPIRY');check(exp.getAudit('t1','a1').some(x=>x.artifactType==='EXPIRED_DATA_REMOVED'),'EXPIRY_AUDIT');const exported=JSON.parse(exp.exportJSON('t1','a1'));check(exported.replayArtifacts.length>0,'REPLAY_ARTIFACTS');check(exported.operationalUseAllowed===false,'EXPORT_GUARD');check(exp.getAudit().some(x=>x.artifactType==='MEMORY_CREATED'),'MEMORY_AUDIT');check(exp.getAudit().some(x=>x.artifactType==='EPISODE_ADDED'),'EPISODE_AUDIT');
const source=[E.toString(),DriverRuntimeMemoryModel.DriverRuntimeMemory.toString(),T.toString()].join(' ');check(!/localStorage|sessionStorage|indexedDB/.test(source),'NO_BROWSER_STORAGE');check(!/fetch\s*\(|XMLHttpRequest|WebSocket/.test(source),'NO_NETWORK');check(!/indexedDB|openDatabase|SQL/.test(source),'NO_DATABASE');check(!/writeFile|FileSystem|showSaveFilePicker/.test(source),'NO_FILESYSTEM');check(!/getUserMedia|SpeechRecognition/.test(source),'NO_MICROPHONE');check(!/brake|steer|vehicleControl/i.test(source),'NO_VEHICLE_CONTROL');check(!/userName|biometric|personalProfile/i.test(source),'NO_PROFILE');
const artifactTypes=e.getReplayArtifacts('t1','a1').map(x=>x.artifactType);['MEMORY_WINDOW_UPDATED','FATIGUE_TREND_CHANGED','RISK_TREND_CHANGED','CONFIDENCE_TREND_CHANGED','CONTEXT_TREND_CHANGED'].forEach(type=>check(artifactTypes.includes(type),'ARTIFACT_'+type));check(e.getAudit('t1','a1').some(x=>x.artifactType==='WINDOW_UPDATED'),'WINDOW_UPDATED_AUDIT');const insufficientEngine=new E({now:()=>now});insufficientEngine.ingest({...base,metric:'PERCLOS',value:.1,timestamp:now-240000});insufficientEngine.ingest({...base,metric:'PERCLOS',value:.2,timestamp:now});insufficientEngine.getMemory('t1','a1');insufficientEngine.getMemory('t1','a1');check(insufficientEngine.getAudit().some(x=>x.artifactType==='INSUFFICIENT_DATA'),'INSUFFICIENT_AUDIT');check(insufficientEngine.getAudit().filter(x=>x.artifactType==='INSUFFICIENT_DATA').length===1,'INSUFFICIENT_DEDUP');const beforeChange=e.getReplayArtifacts('t1','a1').filter(x=>x.artifactType.endsWith('TREND_CHANGED')).length;e.getMemory('t1','a1');check(e.getReplayArtifacts('t1','a1').filter(x=>x.artifactType.endsWith('TREND_CHANGED')).length===beforeChange,'NO_IDENTICAL_TREND_CHANGE');check(JSON.parse(JSON.stringify(e.getReplayArtifacts())).length>0,'ARTIFACT_JSON_SAFE');check(e.getReplayArtifacts().every(x=>Object.isFrozen(x)&&Object.isFrozen(x.payload)&&x.operationalUseAllowed===false),'ARTIFACT_IMMUTABLE');
let gatewayCalls=0,preemptCalls=0;const gateway={selectTrendVoice:async()=>{gatewayCalls++;return{deliveryState:'PLAYED',decisionId:'voice-'+gatewayCalls,scenarioId:'TREND_SCENARIO',reasonCodes:['EXISTING_POLICY_SELECTED'],cooldownDecision:'ELIGIBLE',ackSuppressionState:'NOT_SUPPRESSED'}},preemptTrendVoice:()=>{preemptCalls++}};let voiceResult=await e.selectTrendVoice('t1','a1',{voiceGateway:gateway,materialWindowKey:'w1'});check(voiceResult.selected===true,'TREND_VOICE_SELECTED');check(e.getReplayArtifacts('t1','a1').some(x=>x.artifactType==='TREND_VOICE_SELECTED'),'TREND_VOICE_ARTIFACT');check(gatewayCalls===1,'VOICE_GATEWAY_USED');const voiceArtifact=e.getReplayArtifacts('t1','a1').find(x=>x.artifactType==='TREND_VOICE_SELECTED');check(voiceArtifact.payload.voiceDecisionId==='voice-1','VOICE_DECISION_LINK');check(voiceArtifact.sourceArtifactIds.length>0,'TREND_VOICE_LINEAGE');voiceResult=await e.selectTrendVoice('t1','a1',{voiceGateway:gateway,materialWindowKey:'w1'});check(!voiceResult.selected&&voiceResult.reason==='UNCHANGED_TREND_DEBOUNCED','TREND_DEBOUNCE');check(gatewayCalls===1,'DEBOUNCE_NO_ENQUEUE');
for(const hazardType of ['COLLISION_CRITICAL','PEDESTRIAN_IMMEDIATE','VEHICLE_LOW_TTC','RIGHT_TURN_PEDESTRIAN_CRITICAL','INCAPACITATION_NO_RESPONSE','ALCOHOL_IN_OPERATION']){const before=gatewayCalls,out=await e.selectTrendVoice('t1','a1',{voiceGateway:gateway,immediateHazard:{active:true,type:hazardType},materialWindowKey:hazardType});check(!out.selected&&out.reason==='IMMEDIATE_HAZARD_DOMINANCE','HAZARD_'+hazardType);check(gatewayCalls===before,'HAZARD_NO_ENQUEUE_'+hazardType)}check(e.notifyImmediateHazard('t1','a1',{active:true,type:'COLLISION_CRITICAL'},gateway).dominance==='ACTIVE','IMMEDIATE_DOMINANCE_STATE');check(preemptCalls===1,'IMMEDIATE_PREEMPTS_TREND');
const policyGateway={selectTrendVoice:async()=>({deliveryState:'SUPPRESSED',reason:'COOLDOWN_APPLIED',decisionId:'policy-d1',cooldownDecision:'SUPPRESSED',ackSuppressionState:'NOT_SUPPRESSED'})};voiceResult=await e.selectTrendVoice('t1','a1',{voiceGateway:policyGateway,materialWindowKey:'w2'});check(!voiceResult.selected&&voiceResult.reason==='COOLDOWN_APPLIED','EXISTING_COOLDOWN_REUSED');const ackGateway={selectTrendVoice:async()=>({deliveryState:'SUPPRESSED',reason:'ACK_SUPPRESSION_APPLIED',decisionId:'policy-d2',cooldownDecision:'ELIGIBLE',ackSuppressionState:'PHYSICAL_BUTTON'})};voiceResult=await e.selectTrendVoice('t1','a1',{voiceGateway:ackGateway,materialWindowKey:'w3'});check(!voiceResult.selected&&voiceResult.reason==='ACK_SUPPRESSION_APPLIED','PHYSICAL_ACK_REUSED');check(e.getMemory('t1','a1')!==null,'ACK_NO_TREND_CLEAR');check(voiceArtifact.payload.immediateHazardState==='INACTIVE','VOICE_ARTIFACT_HAZARD_STATE');
const explanation=e.getTrendExplanation('t1','a1');check(explanation.voiceSelected&&explanation.chain.length===4,'EXPLANATION_CHAIN');const noVoiceEngine=new E({now:()=>now});noVoiceEngine.ingest({...base,metric:'BLINK',value:1,timestamp:now});check(noVoiceEngine.getTrendExplanation('t1','a1').chain.length===0,'NO_FABRICATED_VOICE_CHAIN');check(JSON.parse(e.exportJSON('t1','a1')).replayArtifacts.some(x=>x.artifactType==='TREND_VOICE_SELECTED'),'EXPORT_EXACT_ARTIFACTS');
let delayedCallback=null;const delayed=e.scheduleTrendVoice('t1','a1',{voiceGateway:gateway,materialWindowKey:'stale'},0,fn=>{delayedCallback=fn});e.resetTarget('t1');await delayedCallback();check((await delayed).reason==='STALE_GENERATION','STALE_TARGET_BLOCKED');check(e.getReplayArtifacts('t1','a1').some(x=>x.artifactType==='MEMORY_RESET'),'MEMORY_RESET_ARTIFACT');check(e.getAudit().some(x=>x.artifactType==='RESET'),'RESET_AUDIT_PRESERVED');const assignmentEngine=new E({now:()=>now});assignmentEngine.ingest({canonicalTargetId:'stale-t',assignmentId:'stale-a',metric:'PERCLOS',value:.5,timestamp:now});let assignmentCallback=null,pendingAssignment=assignmentEngine.scheduleTrendVoice('stale-t','stale-a',{voiceGateway:gateway},0,fn=>{assignmentCallback=fn});assignmentEngine.resetAssignment('stale-a');await assignmentCallback();check((await pendingAssignment).reason==='STALE_GENERATION','STALE_ASSIGNMENT_BLOCKED');const allEngine=new E({now:()=>now});allEngine.ingest({canonicalTargetId:'all-t',assignmentId:'all-a',metric:'PERCLOS',value:.5,timestamp:now});let allCallback=null,pendingAll=allEngine.scheduleTrendVoice('all-t','all-a',{voiceGateway:gateway},0,fn=>{allCallback=fn});allEngine.resetAll();await allCallback();check((await pendingAll).reason==='STALE_GENERATION','STALE_ALL_BLOCKED');check(e.getReplayArtifacts('t1','a1').find(x=>x.artifactType==='MEMORY_RESET').generation>=1,'RESET_GENERATION');
check(pass.length>=150,'MINIMUM_150');document.title=`PASS - Driver Runtime Memory (${pass.length})`;results.textContent=pass.join('\n')})().catch(e=>{document.title='FAIL - Driver Runtime Memory';results.textContent=e.stack;throw e})</script></body></html>
